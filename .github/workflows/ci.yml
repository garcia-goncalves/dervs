name: CI

# Escalonado de proposito: no push roda so o barato. A cota de minutos desta
# conta ja estourou uma vez (2.313 min em 30 dias num repositorio so), e a
# cobranca e por tarefa arredondada — job paralelo triplica a conta.
#
# `vivo/` e a subarvore do dervs-hub: Node, preservado so para leitura humana.
# Nao e compilado nem testado nesta fatia, e mudanca la dentro nao gasta minuto
# de Actions. O que a CI faz com `vivo/` e uma coisa so: conferir que a barreira
# que o mantem fora da imagem continua de pe.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'vivo/**']
  pull_request:
    paths-ignore: ['vivo/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sem dependencia externa: e a virtude do projeto, e a CI cobra isso.
      - name: Nada de dependencia externa
        run: |
          if ls requirements*.txt pyproject.toml 2>/dev/null | grep -q .; then
            echo "Este projeto e de biblioteca padrao. Apareceu arquivo de dependencia."
            exit 1
          fi

      # A barreira mais importante do repositorio. O codigo em vivo/ abre um
      # terminal (PTY) sem autenticacao nenhuma; publicado, e execucao remota de
      # comando aberta para a internet. Duas trancas independentes o seguram, e
      # este passo existe para que remover qualquer uma delas fique VERMELHO
      # antes de virar deploy — nao depois.
      - name: A barreira do vivo/ continua de pe
        run: |
          erro=0
          if ! grep -qx 'vivo/' .dockerignore; then
            echo "FALHOU: .dockerignore perdeu a linha 'vivo/'."
            erro=1
          fi
          if grep -qE '^\s*COPY\s+\.\s+' Dockerfile; then
            echo "FALHOU: o Dockerfile voltou a usar 'COPY . .'."
            echo "A copia tem de ser explicita, arquivo por arquivo."
            erro=1
          fi
          if grep -rn --include='*.py' --exclude-dir=vivo -E '(^|[^.[:alnum:]_])(import|from)[[:space:]]+vivo\b' . ; then
            echo "FALHOU: codigo da raiz importando de vivo/."
            erro=1
          fi
          if [ "$erro" = "0" ]; then echo "As duas trancas de pe, e ninguem importa vivo/."; fi
          exit $erro

      - name: Compila
        run: python -m py_compile banco.py github_app.py regras.py memoria.py coletar.py coletar_github.py coletar_pesado.py servir.py execucao.py barreira.py fila.py agente/__init__.py agente/enviar.py

      # Os testes abaixo sao listados A MAO, um passo cada, porque cada nome na
      # tela do GitHub diz o que quebrou sem ninguem abrir o log. O preco disso
      # e esquecer de acrescentar o arquivo novo — e arquivo esquecido nao fica
      # vermelho, fica invisivel. Este passo cobra a lista.
      - name: Nenhum arquivo de teste ficou de fora
        run: |
          faltou=0
          for t in test_*.py; do
            grep -q "python $t" .github/workflows/ci.yml || { echo "FALTOU na CI: $t"; faltou=1; }
          done
          if [ "$faltou" = "0" ]; then echo "Todos os test_*.py estao na CI."; fi
          exit $faltou

      # As seis tabelas da etapa 8, mais o cofre. O que ele cobra alem de "a
      # tabela existe": nenhum segredo em claro, arquivar sem motivo recusado, e
      # o "x" de um usuario nao escondendo o alerta do outro.
      - name: Banco multiusuário
        run: python test_banco.py

      # A cortina: a combinacao de seis digitos conferida NO SERVIDOR, o selo
      # assinado e o teto de tentativas por origem. O teto e por origem, e nao
      # global, porque contador global deixa um estranho trancar a casa inteira
      # com cinco chutes — foi o defeito que a etapa 8 removeu do pareamento.
      - name: Cortina
        run: python test_cortina.py

      # A aritmetica da curva P-256, escrita a mao. Os vetores vem de FORA —
      # RFC 6979 A.2.5, os mesmos que o NIST publica. Codigo de criptografia
      # testado so com dado que ele mesmo produziu nao esta testado: prova que
      # concorda consigo, nao que esta certo. Este passo e barato (0,2 s) e e o
      # unico que garante que a conferencia de assinatura ainda confere.
      - name: Curva P-256
        run: python test_p256.py

      # A assinatura RSA do GitHub App, tambem escrita a mao, e pela mesma
      # razao: o Python nao traz RSA e o projeto nao adota dependencia. O vetor
      # vem de FORA — chave e assinatura produzidas pelo OpenSSL 3.5.4. Se a
      # nossa conta discordar do OpenSSL num byte, este passo fica vermelho, e
      # e a unica coisa entre um defeito aqui e um `401` sem explicacao no
      # servidor.
      - name: Assinatura do GitHub App
        run: python test_github_app.py

      # A camada WebAuthn: CBOR, chave COSE, dados do autenticador, cadastro,
      # entrada, e o contador que pega passkey copiada. Todo parser aqui trata
      # o que chega como hostil, e cada recusa tem um teste com o nome do
      # ataque que ela barra.
      - name: Chave de acesso
        run: python test_passkey.py

      # O login por GitHub. NENHUM destes testes toca a rede: as funcoes que
      # falam com o GitHub recebem a funcao de abrir URL por parametro, e o
      # teste passa um duble que estoura em URL nao prevista.
      - name: Autenticação
        run: python test_autenticacao.py

      - name: Motor de regras
        run: python test_regras.py

      - name: Coletor
        run: python test_coletar.py

      - name: Coletor pesado
        run: python test_coletar_pesado.py

      - name: Memória do tempo
        run: python test_memoria.py

      - name: Servidor
        run: python test_servir.py

      # O VIGIA. Ele prova que nenhuma rota do servidor executa comando, lendo
      # a tabela `servir.ROTAS` em memoria. Se ele sair daqui, a barreira da
      # etapa 7 vira texto: ninguem repara que voltou ate estar em producao.
      - name: Vigia das rotas
        run: python test_rotas.py

      - name: Execução
        run: python test_execucao.py

      # Estes dois nunca tinham rodado no GitHub: 128 testes, e sao a barreira
      # de comando e o motor da fila — as duas pecas onde defeito custa caro.
      - name: Barreira de comando
        run: python test_barreira.py

      - name: Fila
        run: python test_fila.py

      # O agente local e o pareamento por seis digitos. O que ele cobra de mais
      # importante nao e "o codigo funciona": e que o teto de chute POR ORIGEM
      # exista na rota (divida nomeada da etapa 8), que o token fique preso a
      # uma maquina e uma conta, e que NAO exista rota de "estou vivo" separada
      # — sinal proprio deixa a maquina parecer viva com a medicao parada.
      - name: Agente e pareamento
        run: python test_agente.py

      # ETAPA 15 — os oito itens verificaveis do design.md viram verificacao.
      # Cor literal solta num componente, token de estado pintando um botao,
      # "loading" numa tela: nada disso quebra nada, nada disso aparece numa
      # revisao apressada, e e assim que a feiura volta. Dois dos oito itens
      # exigem olho humano, e o teste diz isso na propria saida em vez de se
      # calar — lista de oito com seis verificados e dois calados se le como
      # oito verificados.
      - name: Os oito itens do design
        run: python test_design.py

      # ETAPA 16 — a lista de copia do Dockerfile acompanha o que servir.py
      # importa. Entre a etapa 9 e a 14 nasceram sete arquivos de runtime e
      # nenhum entrou na imagem: ela morria no primeiro `import autenticacao` e
      # esta verificacao ficava verde o tempo todo, porque ela roda os testes e
      # nao a imagem. O teste le o Dockerfile como texto e nao precisa de
      # Docker; quem sobe a imagem de verdade e o workflow de publicacao.
      - name: A imagem leva tudo o que precisa, e nada alem
        run: python test_imagem.py

      # ETAPA 17 — o workflow de publicacao leva ao servidor o que abre
      # a porta. Em 28/08/2026 o site subiu verde, respondendo e bonito,
      # e sem entrada nenhuma: em producao /entrar/github e a UNICA
      # rota de login, e ela responde 404 sem as credenciais do OAuth
      # App, que o workflow nunca levava para o /opt/dervs/.env. Cobre
      # tambem a volta da cortina: cortina.trocar() existia desde a
      # etapa 9 e nada no produto o chamava.
      - name: A publicacao leva o que abre a porta
        run: python test_publicar.py

      # ETAPA 13 — a paleta. O script LE assets/dervs.css, nao uma copia dos
      # valores: ate 27/08/2026 ele tinha a paleta digitada dentro dele, e
      # bastava mudar uma cor no CSS para a verificacao continuar aprovando a
      # cor velha. Ele sai com codigo 1 se qualquer par ficar abaixo de 4,5:1
      # (texto) ou 3:1 (contorno com significado), e tambem se o escuro do
      # sistema divergir do escuro do botao de tema.
      - name: Contraste da paleta
        run: python docs/esteira/dervs/contraste.py
