<!-- As portas de entrada. Este arquivo NUNCA e servido sozinho: ele e injetado
     no lugar de __PORTA_ABERTA__ dentro de index-cortina.html, e SO depois que
     a combinacao de seis digitos foi aceita.

     Por que nao esta dentro da propria capa, escondido por CSS: quem der Ctrl+U
     na primeira visita nao pode achar formulario de login nenhum. Esconder com
     `hidden` esconde do olho, nao do codigo-fonte — e a cortina existe
     justamente para que um robo de varredura nao descubra que ha sistema aqui.
     O mesmo vale para o script la embaixo: ele fala de chave de acesso, e isso
     ja e informacao. -->
<div class="portas" id="portas">
  <p class="linha prompt">./entrar.sh &#8212;&#8202;escolha a porta</p>

  <div class="menu">
    __BOTOES__
  </div>

  <!-- A porta do papel. Nasce fechada porque e a saida de emergencia, e nao o
       caminho de todo dia: mostra-la aberta convidaria a usar o codigo por
       comodidade, e cada codigo usado e um a menos para o dia da pane. -->
  <form id="form-codigo" class="codigo" hidden>
    <label class="rotulo-codigo" for="codigo">
      C&#243;digo de recupera&#231;&#227;o (aquele que voc&#234; anotou)
    </label>
    <input id="codigo" name="codigo" type="text" autocomplete="one-time-code"
           spellcheck="false" autocapitalize="characters" enterkeyhint="go"
           placeholder="XXXXX-XXXXX-XXXXX-XXXXX" maxlength="40">
    <button type="submit" class="entrar">Usar este c&#243;digo</button>
    <p class="dica">Mai&#250;scula, min&#250;scula e tracinho tanto faz.</p>
  </form>

  <!-- role="status" faz o leitor de tela anunciar a mudanca sozinho, sem tirar
       o foco de onde a pessoa esta. -->
  <p class="aviso-porta" id="aviso-porta" role="status" aria-live="polite"></p>
</div>

<script src="/assets/portas.js"></script>
