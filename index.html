<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUB do dev</title>
<link rel="icon" href="/painel-projetos.svg">
<!--
  HUB do dev — uma pergunta so: "o que precisa de mim agora?".

  A arquitetura da tela e deliberada e vem da pesquisa de 24/08/2026:
    - CAIXA NO TOPO. O que pede acao ocupa o alto. O que esta saudavel nao ocupa
      tela nenhuma. Rolagem mata habito: painel que exige rolar para achar o que
      importa e aberto uma vez por semana e depois nunca mais.
    - TABELA, NAO CARTAO. Uma linha por projeto, colapsada por padrao. Cartao
      grande e bonito na primeira semana e custa rolagem todo dia depois.
    - CARIMBO EM TODO NUMERO. Cada camada mostra ha quanto tempo foi medida e
      esmaece quando envelhece. Se o painel mentir uma vez, o habito morre.
    - MOSTRA O VELHO ENQUANTO BUSCA O NOVO. A tela nunca espera coleta.

  Sem build, sem dependencia externa, um arquivo so — a virtude do projeto.
-->
<style>
:root{
  color-scheme:light dark;
  --bg:#f6f7f9; --painel:#fff; --borda:#e2e5ea; --texto:#12151a; --fraco:#5f6672;
  --fraquinho:#8b93a1; --acento:#3b6ef5; --ok:#1a8a52; --alerta:#b8720b; --erro:#c8382f;
  --grade:#eceff3; --sombra:0 1px 2px rgba(16,20,28,.06),0 4px 14px rgba(16,20,28,.05);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1014; --painel:#151a21; --borda:#252c36; --texto:#e6eaf0; --fraco:#98a1af;
  --fraquinho:#6b7482; --acento:#6f97ff; --ok:#3fbb7a; --alerta:#e0a038; --erro:#ef6b60;
  --grade:#1c222b; --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --bg:#0d1014; --painel:#151a21; --borda:#252c36; --texto:#e6eaf0; --fraco:#98a1af;
  --fraquinho:#6b7482; --acento:#6f97ff; --ok:#3fbb7a; --alerta:#e0a038; --erro:#ef6b60;
  --grade:#1c222b; --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--acento)}
.env{max-width:1200px;margin:0 auto;padding:20px 22px 80px}

header.topo{display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:21px;margin:0;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--fraco);font-size:12.5px;margin-top:3px}
.acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.btn{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;
  border:1px solid var(--borda);background:var(--painel);color:var(--texto);cursor:pointer}
button.btn:hover{border-color:var(--acento)}
button.btn:disabled{opacity:.5;cursor:progress}

/* ----------------------------------------------------------------- as abas */
nav.abas{display:flex;gap:2px;border-bottom:1px solid var(--borda);margin:-6px 0 18px}
nav.abas button{font:inherit;font-size:13px;font-weight:550;padding:8px 14px;
  border:0;border-bottom:2px solid transparent;background:none;color:var(--fraco);
  cursor:pointer;margin-bottom:-1px}
nav.abas button:hover{color:var(--texto)}
nav.abas button[aria-selected="true"]{color:var(--texto);border-bottom-color:var(--acento)}
nav.abas button:focus-visible{outline:2px solid var(--acento);outline-offset:-2px;border-radius:5px}

/* ------------------------------------------------------------ o grafo */
#quadro-grafo{width:100%;height:min(72vh,760px);border:1px solid var(--borda);
  border-radius:10px;background:var(--painel);display:block}
.cartao-grafo{border:1px solid var(--borda);border-radius:10px;background:var(--painel);
  padding:26px;text-align:center;box-shadow:var(--sombra)}
.cartao-grafo h3{margin:0 0 8px;font-size:15px;font-weight:600}
.cartao-grafo p{margin:0 auto 16px;color:var(--fraco);font-size:13px;max-width:56ch}

/* ---------------------------------------------------------------- a caixa */
h2.secao{font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--fraco);font-weight:650;margin:0 0 10px}
.caixa{display:flex;flex-direction:column;gap:7px;margin-bottom:26px}
.item{display:flex;gap:11px;align-items:center;background:var(--painel);
  border:1px solid var(--borda);border-left:3px solid var(--fraquinho);
  border-radius:9px;padding:10px 13px;box-shadow:var(--sombra)}
.item.alta{border-left-color:var(--erro)}
.item.media{border-left-color:var(--alerta)}
.item.baixa{border-left-color:var(--fraquinho)}
.item .corpo{flex:1;min-width:0}
.item .txt{font-size:13.5px}
.item .meta{font-size:11.5px;color:var(--fraquinho);margin-top:2px;
  font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-family:var(--mono);font-size:11px;background:var(--grade);
  padding:1px 6px;border-radius:4px;color:var(--fraco)}
.item .botoes{display:flex;gap:6px;flex-shrink:0}
button.agir{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:7px;
  border:1px solid var(--acento);background:var(--acento);color:#fff;cursor:pointer;
  white-space:nowrap}
button.agir:hover{filter:brightness(1.08)}
button.agir:disabled{opacity:.55;cursor:progress}
button.calar{font:inherit;font-size:12.5px;padding:6px 9px;border-radius:7px;
  border:1px solid var(--borda);background:transparent;color:var(--fraco);cursor:pointer}
.limpa{background:var(--painel);border:1px solid var(--borda);border-radius:9px;
  padding:18px;text-align:center;color:var(--fraco);box-shadow:var(--sombra)}
.limpa b{color:var(--ok)}
details.gaveta>summary{font-weight:500;color:var(--fraco)}
.caixa.dentro{padding:10px;border-top:1px solid var(--borda);margin-bottom:0;
  background:var(--bg);content-visibility:auto;contain-intrinsic-size:auto none auto 400px}

/* ---------------------------------------------------------------- a tabela */
details.todos{background:var(--painel);border:1px solid var(--borda);
  border-radius:10px;box-shadow:var(--sombra);overflow:hidden}
details.todos>summary{cursor:pointer;padding:11px 14px;font-size:13px;
  font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.todos>summary::-webkit-details-marker{display:none}
details.todos>summary::after{content:"▾";color:var(--fraquinho);font-size:11px}
details.todos[open]>summary::after{content:"▴"}
details.todos>summary:hover{background:var(--grade)}
.rolagem{overflow-x:auto;border-top:1px solid var(--borda);
  /* Tabela colapsada e conteudo fora da dobra: o navegador so calcula o layout
     dela quando o dono abre. contain-intrinsic-size evita o pulo de rolagem. */
  content-visibility:auto;contain-intrinsic-size:auto none auto 520px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--fraco);font-size:11px;
  text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;
  border-bottom:1px solid var(--borda);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--grade);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.nome{font-weight:600}
td.num{font-family:var(--mono);text-align:right}
.pt{color:var(--ok)} .pt.mal{color:var(--erro)} .pt.meio{color:var(--alerta)}
.tenue{color:var(--fraquinho)}
.velho{opacity:.45}

.rodape{margin-top:22px;font-size:12px;color:var(--fraquinho);
  display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono)}
.aviso{margin-top:14px;background:var(--painel);border:1px solid var(--erro);
  border-radius:9px;padding:10px 13px;font-size:12.5px;color:var(--erro)}
#recado{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--texto);color:var(--bg);padding:9px 16px;border-radius:8px;
  font-size:13px;max-width:min(680px,90vw);box-shadow:var(--sombra);
  opacity:0;pointer-events:none;transition:opacity .18s}
#recado.ver{opacity:1}
@media (prefers-reduced-motion:reduce){#recado{transition:none}}
</style>
</head>
<body>
<div class="env">
  <header class="topo">
    <div>
      <h1>HUB do dev</h1>
      <div class="sub" id="linhafina">carregando…</div>
    </div>
    <div class="acoes">
      <button class="btn" id="btn-recoletar">Medir agora</button>
      <button class="btn" id="btn-github">Atualizar GitHub</button>
      <button class="btn" id="btn-tema">Tema</button>
    </div>
  </header>

  <nav class="abas" role="tablist" aria-label="Seções do HUB">
    <button role="tab" id="aba-btn-painel" aria-controls="aba-painel"
            aria-selected="true" tabindex="0">Painel</button>
    <button role="tab" id="aba-btn-grafo" aria-controls="aba-grafo"
            aria-selected="false" tabindex="-1">Grafo de código</button>
  </nav>

  <div id="aba-painel" role="tabpanel" aria-labelledby="aba-btn-painel" tabindex="0">
  <h2 class="secao">Precisa de você agora</h2>
  <div class="caixa" id="caixa"></div>

  <details class="todos" id="todos">
    <summary><span id="rot-todos">Todos os projetos</span><span></span></summary>
    <div class="rolagem">
      <table>
        <thead><tr>
          <th>Projeto</th><th>Fase</th><th>Ramo</th><th>CI</th><th>Contêineres</th>
          <th>Sem commit</th><th>Sem enviar</th><th>Última atividade</th>
          <th>Prontidão</th><th>Grafo</th><th>Medido</th>
        </tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
  </details>

  <div id="falhas"></div>
  </div><!-- /aba-painel -->

  <!-- Vazio de proposito: o quadro do grafo so entra no DOM quando o dono abre
       esta aba. Ver montaGrafo() la embaixo. -->
  <div id="aba-grafo" role="tabpanel" aria-labelledby="aba-btn-grafo" tabindex="0" hidden></div>

  <div class="rodape" id="rodape"></div>
</div>
<div id="recado" role="status" aria-live="polite"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
let ESTADO = null, ocupado = false;

/* ------------------------------------------------------------------ tempo */
function haQuanto(iso){
  if(!iso) return "—";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 0) return "agora";
  if (s < 90) return Math.round(s) + " s";
  if (s < 5400) return Math.round(s/60) + " min";
  if (s < 172800) return Math.round(s/3600) + " h";
  return Math.round(s/86400) + " d";
}
/* Cada camada tem sua propria expectativa de frescor. Passou do dobro dela, o
   numero esmaece — o dono ve que aquilo esta velho antes de confiar nele. */
const FRESCOR = {local: 120, github: 2400, pesado: 172800};
function velho(iso, camada){
  if(!iso) return true;
  return (Date.now() - Date.parse(iso))/1000 > (FRESCOR[camada]||120) * 2;
}

function recado(txt, erro){
  const el = $("#recado");
  el.textContent = txt;
  el.style.background = erro ? "var(--erro)" : "var(--texto)";
  el.style.color = "#fff";
  el.classList.add("ver");
  clearTimeout(recado._t);
  recado._t = setTimeout(() => el.classList.remove("ver"), erro ? 9000 : 4000);
}

/* ------------------------------------------------------------------ acoes */
async function mandar(corpo){
  const r = await fetch("/api/acao", {
    method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN},
    body: JSON.stringify(corpo)
  });
  return r.json();
}

async function agir(pend, botao){
  const a = pend.acao;
  if (a.tipo === "abrir_url"){ window.open(a.url, "_blank", "noopener"); return; }
  if (a.tipo === "copiar"){
    try { await navigator.clipboard.writeText(a.texto); recado("Copiado."); }
    catch { recado("Não consegui copiar. O texto é: " + a.texto, true); }
    return;
  }
  if (ocupado){ recado("Espere a ação anterior terminar."); return; }
  ocupado = true; botao.disabled = true;
  const antes = botao.textContent; botao.textContent = "…";
  try{
    const corpo = a.tipo === "vscode"
      ? {comando:"vscode", projeto: pend.projeto}
      : {comando: a.comando, projeto: a.projeto || pend.projeto};
    const r = await mandar(corpo);
    recado(r.ok ? (r.saida || "Feito.") : ("Não deu certo: " + (r.saida||r.erro)), !r.ok);
  } catch(e){ recado("Não consegui falar com o servidor: " + e.message, true); }
  finally{
    ocupado = false; botao.disabled = false; botao.textContent = antes;
    carregar();
  }
}

async function calar(pend){
  const r = await mandar({comando:"silenciar", id: pend.id, horas: 24});
  recado(r.ok ? "Escondida por 24 h." : "Não deu certo.", !r.ok);
  carregar();
}

/* ------------------------------------------------------------------ a caixa */
function desenhaCaixa(pend){
  const caixa = $("#caixa");
  caixa.textContent = "";
  if (!pend.length){
    const d = document.createElement("div");
    d.className = "limpa";
    d.innerHTML = "<b>Caixa limpa.</b> Nenhum projeto está esperando você agora.";
    caixa.append(d);
    return;
  }
  // So o urgente fica a vista. O resto entra numa gaveta fechada — 25 itens
  // empilhados sao a rolagem que faz o dono parar de abrir o painel.
  const altas = pend.filter(p => p.gravidade === "alta");
  const resto = pend.filter(p => p.gravidade !== "alta");
  itensEm(caixa, altas);
  if (!altas.length){
    const d = document.createElement("div");
    d.className = "limpa";
    d.innerHTML = "<b>Nada urgente.</b> O que sobrou pode esperar.";
    caixa.append(d);
  }
  if (resto.length){
    const det = document.createElement("details");
    det.className = "todos gaveta";
    const s = document.createElement("summary");
    s.append(document.createTextNode(
      "Mais " + resto.length + " item(ns) que podem esperar"));
    s.append(document.createElement("span"));
    det.append(s);
    const dentro = document.createElement("div");
    dentro.className = "caixa dentro";
    itensEm(dentro, resto);
    det.append(dentro);
    caixa.append(det);
  }
}

function itensEm(caixa, pend){
  for (const p of pend){
    const li = document.createElement("div");
    li.className = "item " + p.gravidade;

    const corpo = document.createElement("div");
    corpo.className = "corpo";
    const txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = p.texto;
    corpo.append(txt);
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (p.projeto ? p.projeto + " · " : "") + (p.detalhe || p.regra);
    corpo.append(meta);
    li.append(corpo);

    const botoes = document.createElement("div");
    botoes.className = "botoes";
    const b = document.createElement("button");
    b.className = "agir";
    b.textContent = p.acao.rotulo;
    b.addEventListener("click", () => agir(p, b));
    botoes.append(b);
    const c = document.createElement("button");
    c.className = "calar";
    c.title = "Esconder por 24 horas";
    c.textContent = "×";
    c.addEventListener("click", () => calar(p));
    botoes.append(c);
    li.append(botoes);
    caixa.append(li);
  }
}

/* ----------------------------------------------------------------- a tabela */
function celula(texto, classe){
  const td = document.createElement("td");
  if (classe) td.className = classe;
  td.textContent = texto;
  return td;
}

function ciTexto(p){
  const gh = p.github;
  if (!gh) return "—";
  const c = gh.ci || {};
  if (c.conclusao === "failure") return "falhou";
  if (c.conclusao === "success") return "passou";
  return c.estado_bruto ? c.estado_bruto.toLowerCase() : "sem CI";
}

function desenhaTabela(projetos){
  const tb = $("#linhas");
  tb.textContent = "";
  for (const p of projetos){
    const g = p.git || {}, pr = p.prontidao || {};
    const tr = document.createElement("tr");
    tr.append(celula(p.nome, "nome"));
    tr.append(celula(p.fase || "—", "tenue"));
    tr.append(celula(g.branch || "—", "tenue"));

    const ci = celula(ciTexto(p));
    if (ciTexto(p) === "falhou") ci.style.color = "var(--erro)";
    else if (ciTexto(p) === "passou") ci.style.color = "var(--ok)";
    else ci.className = "tenue";
    tr.append(ci);

    // Quantos containers SAUDAVEIS o projeto tem agora. containers_esperados e
    // uma lista de nomes a casar, nao uma quantidade — mostrar "10/1" mentia.
    const vivos = (p.containers||[]).filter(c => c.saudavel && !c.reiniciando).length;
    const esperaContainer = (p.containers_esperados||[]).length > 0;
    const cel = celula(vivos || (esperaContainer ? "0" : "—"), "num");
    if (esperaContainer && !vivos && p.aberto_no_editor) cel.style.color = "var(--erro)";
    else cel.classList.add("tenue");
    tr.append(cel);

    tr.append(celula(g.sujos || "—", "num"));
    tr.append(celula(g.ahead || "—", "num"));
    tr.append(celula(g.dias_parado != null ? g.dias_parado + " d" : "—", "num tenue"));

    const pontos = celula((pr.pct != null ? pr.pct + "%" : "—"),
      "num pt " + (pr.pct >= 80 ? "" : pr.pct >= 55 ? "meio" : "mal"));
    tr.append(pontos);

    const gr = p.grafo || {};
    tr.append(celula(gr.indexado ? gr.dias + " d" : "sem", "num tenue"));

    const carimbo = celula(haQuanto((p.medido_em||{}).local), "num tenue");
    if (velho((p.medido_em||{}).local, "local")) carimbo.classList.add("velho");
    tr.append(carimbo);
    tb.append(tr);
  }
  $("#rot-todos").textContent = "Todos os projetos (" + projetos.length + ")";
}

/* ---------------------------------------------------------------- carregar */
async function carregar(){
  let d;
  try { d = await (await fetch("/api/dados")).json(); }
  catch(e){ $("#linhafina").textContent = "servidor fora do ar — " + e.message; return; }
  ESTADO = d;

  desenhaCaixa(d.pendencias);
  desenhaTabela(d.projetos);

  const altas = d.pendencias.filter(p => p.gravidade === "alta").length;
  $("#linhafina").textContent =
    d.projetos.length + " projetos · " + d.pendencias.length + " pendência(s), "
    + altas + " urgente(s) · git medido há " + haQuanto(d.infra_medido_em);

  const q = d.quota;
  const inf = d.infra || {};
  $("#rodape").textContent =
    (inf.containers||[]).length + " contêineres · "
    + (inf.portas||[]).length + " portas escutando"
    + (q ? " · Actions " + q.pct + "% de " + q.cota + " min" : "");

  if (grafoMontado && !$("#aba-grafo").hidden && d.grafo_ui) desenhaGrafo(d.grafo_ui);

  const falhas = $("#falhas");
  falhas.textContent = "";
  for (const [camada, erro] of Object.entries(d.falhas_de_coleta || {})){
    const div = document.createElement("div");
    div.className = "aviso";
    div.textContent = "A coleta da camada " + camada + " falhou — os números dela "
      + "estão velhos, não zerados. Motivo: " + erro;
    falhas.append(div);
  }
}

/* ------------------------------------------------------------------- botoes */
$("#btn-recoletar").addEventListener("click", async e => {
  e.target.disabled = true;
  await mandar({comando:"recoletar", camada:"local"});
  await carregar();
  e.target.disabled = false;
  recado("Medido agora.");
});
$("#btn-github").addEventListener("click", async e => {
  e.target.disabled = true;
  recado("Consultando o GitHub…");
  await mandar({comando:"recoletar", camada:"github"});
  await carregar();
  e.target.disabled = false;
});
$("#btn-tema").addEventListener("click", () => {
  const atual = document.documentElement.getAttribute("data-theme");
  const novo = atual === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", novo);
  try { localStorage.setItem("tema", novo); } catch {}
});
try {
  const t = localStorage.getItem("tema");
  if (t) document.documentElement.setAttribute("data-theme", t);
  const aberto = localStorage.getItem("todos-aberto");
  if (aberto === "1") $("#todos").open = true;
} catch {}
$("#todos").addEventListener("toggle", () => {
  try { localStorage.setItem("todos-aberto", $("#todos").open ? "1" : "0"); } catch {}
});

/* ------------------------------------------------------------------- abas */
/* MONTAGEM preguicosa, nao import preguicoso: o quadro do grafo nao existe no
   DOM ate o dono clicar na aba. Grafo pesado dentro de painel e a receita
   classica de painel que demora a abrir. */
const ABAS = [["#aba-btn-painel", "#aba-painel"], ["#aba-btn-grafo", "#aba-grafo"]];
let grafoMontado = false;

function trocaAba(qualBotao, focar){
  for (const [b, painel] of ABAS){
    const ativa = b === qualBotao;
    $(b).setAttribute("aria-selected", ativa ? "true" : "false");
    $(b).tabIndex = ativa ? 0 : -1;
    $(painel).hidden = !ativa;
  }
  if (focar) $(qualBotao).focus();
  try { localStorage.setItem("aba", qualBotao); } catch {}
  if (qualBotao === "#aba-btn-grafo") montaGrafo();
}

for (const [b] of ABAS){
  $(b).addEventListener("click", () => trocaAba(b, false));
  $(b).addEventListener("keydown", e => {
    const i = ABAS.findIndex(([x]) => x === b);
    if (e.key === "ArrowRight") trocaAba(ABAS[(i + 1) % ABAS.length][0], true);
    else if (e.key === "ArrowLeft") trocaAba(ABAS[(i - 1 + ABAS.length) % ABAS.length][0], true);
    else return;
    e.preventDefault();
  });
}

/* -------------------------------------------------------- os tres estados */
let esperandoGrafo = null;

function cartaoGrafo(titulo, texto, rotuloBotao){
  const d = document.createElement("div");
  d.className = "cartao-grafo";
  const h = document.createElement("h3"); h.textContent = titulo;
  const p = document.createElement("p"); p.textContent = texto;
  d.append(h, p);
  if (rotuloBotao){
    const b = document.createElement("button");
    b.className = "btn"; b.textContent = rotuloBotao;
    b.addEventListener("click", async () => {
      b.disabled = true;
      const r = await mandar({comando:"grafo_ligar"});
      if (r && r.ok === false){
        recado(r.saida || "não consegui ligar o grafo.", true);
        b.disabled = false; return;
      }
      desenhaGrafo({estado:"subindo", ha:0});
    });
    d.append(b);
  }
  return d;
}

function desenhaGrafo(g){
  const alvo = $("#aba-grafo");
  if (esperandoGrafo){ clearInterval(esperandoGrafo); esperandoGrafo = null; }

  if (g.estado === "no_ar"){
    /* Recria o quadro so quando ele ainda nao esta la — trocar o src a cada
       carregada faria a tela do grafo recomecar do zero de 15 em 15 s. */
    if (alvo.querySelector("#quadro-grafo")) return;
    alvo.textContent = "";
    const q = document.createElement("iframe");
    q.id = "quadro-grafo"; q.src = "/grafo/"; q.title = "Grafo de código";
    q.loading = "lazy"; q.referrerPolicy = "no-referrer";
    /* CONTORNO de comportamento do grafo, medido em 24/08/2026: a tela dele
       so mede a area de desenho quando a janela muda de tamanho. Sem empurrao,
       o dono abre a aba, escolhe o projeto, ve o menu e os filtros — e a area
       do grafo VAZIA. Conclui que o painel quebrou.
       O empurrao no "load" nao basta sozinho: a area de desenho so nasce quando
       ele escolhe um projeto, bem depois. Dai o observador, que empurra quando o
       desenho aparece e se desliga assim que ele ganha tamanho de verdade. */
    q.addEventListener("load", () => {
      try {
        const jan = q.contentWindow, doc = q.contentDocument;
        const empurra = () => jan.dispatchEvent(new Event("resize"));
        empurra();
        const olho = new jan.MutationObserver(() => {
          const tela = doc.querySelector("canvas");
          if (!tela) return;
          empurra();
          if (tela.width > 300) olho.disconnect();
        });
        olho.observe(doc.body, {childList:true, subtree:true});
      } catch {}
    });
    alvo.append(q);
    return;
  }

  alvo.textContent = "";
  if (g.estado === "subindo"){
    const c = cartaoGrafo("Ligando o grafo…",
      "O primeiro carregamento costuma levar alguns segundos. A tela aparece "
      + "sozinha quando ele responder.", null);
    const cont = document.createElement("p");
    cont.className = "sub"; cont.textContent = "esperando há 0 s";
    c.append(cont);
    alvo.append(c);
    let s = g.ha || 0;
    esperandoGrafo = setInterval(async () => {
      s += 2;
      cont.textContent = "esperando há " + s + " s";
      try {
        const e = await (await fetch("/api/grafo")).json();
        if (e.estado !== "subindo") desenhaGrafo(e);
      } catch {}
    }, 2000);
    return;
  }

  if (g.estado === "sem_exe"){
    alvo.append(cartaoGrafo("O grafo não está instalado nesta máquina",
      "O HUB procurou o programa codebase-memory-mcp no PATH e em "
      + "~/.local/bin e não achou. Sem ele não há o que ligar.", null));
    return;
  }

  alvo.append(cartaoGrafo("O grafo de código está desligado",
    "Ele mapeia funções, chamadas e dependências do seu código. Costuma subir "
    + "junto com o Claude Code — e cai junto quando você fecha. Este botão sobe "
    + "ele pelo HUB, e daí ele fica de pé enquanto o painel estiver de pé.",
    "Ligar o grafo"));
}

function montaGrafo(){
  if (!grafoMontado){
    grafoMontado = true;
    $("#aba-grafo").append(cartaoGrafo("Verificando…", "Um instante.", null));
  }
  fetch("/api/grafo").then(r => r.json()).then(desenhaGrafo).catch(() => {});
}

try {
  const a = localStorage.getItem("aba");
  if (a === "#aba-btn-grafo") trocaAba(a, false);
} catch {}

carregar();
setInterval(carregar, 15000);
</script>
