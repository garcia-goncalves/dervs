<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUB do dev</title>
<link rel="icon" href="/painel-projetos.svg">
<!--
  HUB do dev — uma pergunta so: "o que precisa de mim agora?".

  A arquitetura da tela e deliberada e vem da pesquisa de 24/08/2026:
    - CAIXA NO TOPO. O que pede acao ocupa o alto. O que esta saudavel nao ocupa
      tela nenhuma. Rolagem mata habito: painel que exige rolar para achar o que
      importa e aberto uma vez por semana e depois nunca mais.
    - TABELA, NAO CARTAO. Uma linha por projeto, colapsada por padrao. Cartao
      grande e bonito na primeira semana e custa rolagem todo dia depois.
    - CARIMBO EM TODO NUMERO. Cada camada mostra ha quanto tempo foi medida e
      esmaece quando envelhece. Se o painel mentir uma vez, o habito morre.
    - MOSTRA O VELHO ENQUANTO BUSCA O NOVO. A tela nunca espera coleta.

  Sem build, sem dependencia externa, um arquivo so — a virtude do projeto.
-->
<style>
:root{
  color-scheme:light dark;
  --bg:#f6f7f9; --painel:#fff; --borda:#e2e5ea; --texto:#12151a; --fraco:#5f6672;
  --fraquinho:#8b93a1; --acento:#3b6ef5; --ok:#1a8a52; --alerta:#b8720b; --erro:#c8382f;
  --grade:#eceff3; --sombra:0 1px 2px rgba(16,20,28,.06),0 4px 14px rgba(16,20,28,.05);
  /* Tres tokens SO para texto pequeno sobre fundo claro. Os tons de cima foram
     escolhidos para preencher area e borda, e medem 4,44:1 (--acento), 3,85:1
     (--alerta) e 3,09:1 (--fraquinho) — abaixo dos 4,5:1 que a WCAG exige para
     texto normal. Este projeto ja tinha aprendido isso uma vez, no link do PR. */
  --selo-fundo:#2f57c4; --selo-texto:#fff;   /* 6,4:1  */
  --alerta-texto:#8a5408;                    /* 6,26:1 */
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1014; --painel:#151a21; --borda:#252c36; --texto:#e6eaf0; --fraco:#98a1af;
  --fraquinho:#6b7482; --acento:#6f97ff; --ok:#3fbb7a; --alerta:#e0a038; --erro:#ef6b60;
  --grade:#1c222b; --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  /* No escuro o selo inverte: fundo claro, texto escuro (6,85:1). Branco
     sobre --acento aqui mediria 2,78:1 — reprovacao franca. */
  --selo-fundo:#6f97ff; --selo-texto:#0d1014;
  --alerta-texto:#e0a038;    /* 7,7:1 sobre --painel, ja passava */
}}
:root[data-theme="dark"]{
  --bg:#0d1014; --painel:#151a21; --borda:#252c36; --texto:#e6eaf0; --fraco:#98a1af;
  --fraquinho:#6b7482; --acento:#6f97ff; --ok:#3fbb7a; --alerta:#e0a038; --erro:#ef6b60;
  --grade:#1c222b; --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
  /* No escuro o selo inverte: fundo claro, texto escuro (6,85:1). Branco
     sobre --acento aqui mediria 2,78:1 — reprovacao franca. */
  --selo-fundo:#6f97ff; --selo-texto:#0d1014;
  --alerta-texto:#e0a038;    /* 7,7:1 sobre --painel, ja passava */
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--acento)}
.env{max-width:1200px;margin:0 auto;padding:20px 22px 80px}

header.topo{display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:21px;margin:0;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--fraco);font-size:12.5px;margin-top:3px}
.acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.btn{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;
  border:1px solid var(--borda);background:var(--painel);color:var(--texto);cursor:pointer}
button.btn:hover{border-color:var(--acento)}
button.btn:disabled{opacity:.5;cursor:progress}

/* ------------------------------------------------------------- o briefing */
/* A primeira coisa que o olho pega. Uma frase, escrita a partir do dado — se
   ela nao mudar quando o dado muda, e decoracao, e decoracao no topo de um
   painel operacional ensina a nao ler o topo. */
.briefing{background:var(--painel);border:1px solid var(--borda);border-radius:11px;
  padding:15px 17px;margin-bottom:16px;box-shadow:var(--sombra);
  display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.briefing .frase{flex:1;min-width:min(100%,260px);font-size:16px;font-weight:500;
  line-height:1.45}
.briefing.urgente{border-left:3px solid var(--erro)}
.briefing.calmo{border-left:3px solid var(--ok)}
.placar{display:flex;gap:14px;align-items:center;flex-shrink:0}
/* Menor e mais leve que a frase de proposito: o placar apoia, nao compete. */
.placar .n{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1.1}
/* --fraco, nao --fraquinho: este rotulo e para LER (3,09:1 nao passa). O tom
   mais claro fica reservado a borda e enfeite, como no resto do arquivo. */
.placar .r{font-size:10.5px;color:var(--fraco);text-transform:uppercase;
  letter-spacing:.05em;white-space:nowrap}
.placar .peca{text-align:center}
.placar .peca.mal .n{color:var(--erro)}
.placar .peca.bem .n{color:var(--ok)}
.linha-tendencia{display:block;flex-shrink:0}
.seta{font-size:11px;font-family:var(--mono)}
.seta.piorando{color:var(--erro)} .seta.melhorando{color:var(--ok)}
.seta.estavel{color:var(--fraquinho)}
/* Em 360px sobram ~282px uteis dentro do .briefing. O placar tem 2-3 pecas mais
   96px de sparkline, tudo flex-shrink:0 — sem isto ele estoura a caixa e leva a
   pagina inteira para a rolagem horizontal. O sparkline e o primeiro a sair:
   e o que menos perde ao sumir, porque a seta ao lado diz a mesma direcao. */
@media (max-width:420px){
  .placar{flex-wrap:wrap;width:100%;gap:12px;justify-content:flex-start}
  .linha-tendencia{display:none}
}

/* ---------------------------------------------------------------- a caixa */
h2.secao{font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--fraco);font-weight:650;margin:0 0 10px}
/* O selo de "nova" e a idade. Sem eles, uma coisa nascida ha uma hora e outra
   aberta ha 23 dias ocupavam a mesma linha, do mesmo tamanho, na mesma cor. */
.selo{font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;
  background:var(--selo-fundo);color:var(--selo-texto);padding:1px 6px;border-radius:4px;
  margin-left:7px;vertical-align:1px}
.idade{color:var(--fraquinho)}
.idade.velha{color:var(--alerta-texto)}
/* O grupo: 3+ pendencias da mesma regra numa linha so. Herda o .item para nao
   inventar um segundo vocabulario visual na mesma lista. */
details.grupo{background:var(--painel);border:1px solid var(--borda);
  border-left:3px solid var(--fraquinho);border-radius:9px;box-shadow:var(--sombra)}
details.grupo.alta{border-left-color:var(--erro)}
details.grupo.media{border-left-color:var(--alerta)}
details.grupo.baixa{border-left-color:var(--fraquinho)}
details.grupo>summary{cursor:pointer;padding:10px 13px;font-size:13.5px;
  list-style:none;display:flex;align-items:center;gap:11px}
details.grupo>summary::-webkit-details-marker{display:none}
details.grupo>summary:hover{background:var(--grade);border-radius:7px}
details.grupo>summary .conta-txt{flex:1;min-width:0}
details.grupo>summary .abre{color:var(--fraquinho);font-size:11px;flex-shrink:0}
details.grupo[open]>summary .abre::after{content:"▴"}
details.grupo>summary .abre::after{content:"▾"}
details.grupo .dentro{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
details.grupo .dentro .item{box-shadow:none;background:var(--bg)}
.caixa{display:flex;flex-direction:column;gap:7px;margin-bottom:26px}
.item{display:flex;gap:11px;align-items:center;background:var(--painel);
  border:1px solid var(--borda);border-left:3px solid var(--fraquinho);
  border-radius:9px;padding:10px 13px;box-shadow:var(--sombra)}
.item.alta{border-left-color:var(--erro)}
.item.media{border-left-color:var(--alerta)}
.item.baixa{border-left-color:var(--fraquinho)}
.item .corpo{flex:1;min-width:0}
.item .txt{font-size:13.5px}
.item .meta{font-size:11.5px;color:var(--fraquinho);margin-top:2px;
  font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-family:var(--mono);font-size:11px;background:var(--grade);
  padding:1px 6px;border-radius:4px;color:var(--fraco)}
.item .botoes{display:flex;gap:6px;flex-shrink:0}
button.agir{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:7px;
  border:1px solid var(--acento);background:var(--acento);color:#fff;cursor:pointer;
  white-space:nowrap}
button.agir:hover{filter:brightness(1.08)}
button.agir:disabled{opacity:.55;cursor:progress}
button.calar{font:inherit;font-size:12.5px;padding:6px 9px;border-radius:7px;
  border:1px solid var(--borda);background:transparent;color:var(--fraco);cursor:pointer}
.limpa{background:var(--painel);border:1px solid var(--borda);border-radius:9px;
  padding:18px;text-align:center;color:var(--fraco);box-shadow:var(--sombra)}
.limpa b{color:var(--ok)}
details.gaveta>summary{font-weight:500;color:var(--fraco)}
.caixa.dentro{padding:10px;border-top:1px solid var(--borda);margin-bottom:0;
  background:var(--bg);content-visibility:auto;contain-intrinsic-size:auto none auto 400px}

/* ---------------------------------------------------------------- a tabela */
details.todos{background:var(--painel);border:1px solid var(--borda);
  border-radius:10px;box-shadow:var(--sombra);overflow:hidden}
details.todos>summary{cursor:pointer;padding:11px 14px;font-size:13px;
  font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.todos>summary::-webkit-details-marker{display:none}
details.todos>summary::after{content:"▾";color:var(--fraquinho);font-size:11px}
details.todos[open]>summary::after{content:"▴"}
details.todos>summary:hover{background:var(--grade)}
.rolagem{overflow-x:auto;border-top:1px solid var(--borda);
  /* Tabela colapsada e conteudo fora da dobra: o navegador so calcula o layout
     dela quando o dono abre. contain-intrinsic-size evita o pulo de rolagem. */
  content-visibility:auto;contain-intrinsic-size:auto none auto 520px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--fraco);font-size:11px;
  text-transform:uppercase;letter-spacing:.05em;padding:9px 12px;
  border-bottom:1px solid var(--borda);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--grade);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.nome{font-weight:600}
td.num{font-family:var(--mono);text-align:right}
.pt{color:var(--ok)} .pt.mal{color:var(--erro)} .pt.meio{color:var(--alerta)}
.tenue{color:var(--fraquinho)}
.velho{opacity:.45}
/* "?" nao e numero. Fica na cor de alerta e em italico para o olho nao
   lê-lo como zero — que foi exatamente o defeito que esta tela tinha. */
.nao-medi{color:var(--alerta-texto);font-style:italic;cursor:help}
.peca.nm{color:var(--alerta-texto)}

/* ------------------------------------------------------------------ paleta */
.btn.busca{display:inline-flex;align-items:center;gap:9px;color:var(--fraco)}
.btn.busca kbd{font-size:10px}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--borda);
  border-radius:4px;padding:1px 5px;color:var(--fraquinho);background:var(--grade)}

#paleta{width:min(620px,92vw);max-height:min(70vh,560px);padding:0;border:none;
  border-radius:13px;background:var(--painel);color:var(--texto);
  box-shadow:0 18px 60px rgba(0,0,0,.28);overflow:hidden;
  /* margin auto + top fixo: a paleta abre onde o olho ja esta, nao no centro
     vertical da tela, que num monitor grande fica longe demais da leitura. */
  margin:12vh auto auto}
#paleta::backdrop{background:rgba(0,0,0,.42)}
#paleta .p-topo{display:flex;align-items:center;gap:10px;padding:13px 15px;
  border-bottom:1px solid var(--borda)}
#p-busca{flex:1;border:none;background:none;color:var(--texto);font:inherit;
  font-size:15px;outline:none}
#p-busca::placeholder{color:var(--fraquinho)}
#p-lista{list-style:none;margin:0;padding:6px;overflow-y:auto;
  max-height:calc(min(70vh,560px) - 104px)}
#p-lista li{display:flex;align-items:baseline;gap:10px;padding:8px 11px;
  border-radius:8px;cursor:pointer;scroll-margin:6px}
#p-lista li[aria-selected="true"]{background:var(--grade)}
#p-lista li .rot{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:13.5px}
#p-lista li .sub{font-size:11px;color:var(--fraquinho);font-family:var(--mono);
  white-space:nowrap}
#p-lista li .selo{font-size:10px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--fraquinho);border:1px solid var(--borda);border-radius:99px;
  padding:1px 7px;white-space:nowrap}
#p-lista li.alta .selo{color:var(--erro);border-color:var(--erro)}
#p-lista .vazio{padding:22px 13px;color:var(--fraquinho);font-size:13px;
  cursor:default;justify-content:center}
#paleta .p-rodape{display:flex;gap:14px;align-items:center;padding:9px 15px;
  border-top:1px solid var(--borda);font-size:11px;color:var(--fraquinho)}
#paleta .p-rodape span{display:inline-flex;gap:5px;align-items:center}
#p-conta{margin-left:auto;font-family:var(--mono)}
@media (prefers-reduced-motion:no-preference){
  #paleta[open]{animation:sobe .13s ease-out}
  @keyframes sobe{from{opacity:0;transform:translateY(-6px)}}
}

/* A conta por trás da nota: o número é um botão que abre os critérios. */
.conta-btn{background:none;border:none;padding:0;cursor:pointer;color:inherit;
  font:inherit;border-bottom:1px dotted currentColor}
.conta-btn:hover,.conta-btn:focus-visible{opacity:.75}
tr.conta>td{white-space:normal;background:var(--grade);padding:11px 14px}
tr.conta .pecas{display:flex;flex-wrap:wrap;gap:6px}
tr.conta .peca{font-size:12px;padding:3px 9px;border-radius:99px;
  border:1px solid var(--borda);display:inline-flex;gap:7px;align-items:baseline}
tr.conta .peca i{font-style:normal;font-size:10.5px;color:var(--fraquinho);
  font-family:var(--mono)}
tr.conta .peca.ok{color:var(--ok)}
tr.conta .peca.mal{color:var(--erro);border-color:var(--erro)}
tr.conta .peca.na{color:var(--fraquinho);opacity:.7}
tr.conta p{margin:10px 0 0;font-size:11.5px;font-family:var(--mono)}

.rodape{margin-top:22px;font-size:12px;color:var(--fraquinho);
  display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono)}
.aviso{margin-top:14px;background:var(--painel);border:1px solid var(--erro);
  border-radius:9px;padding:10px 13px;font-size:12.5px;color:var(--erro)}
/* Correcao 2 do juiz de design (24/08/2026): troca SO a cor da borda. O aviso
   do proprio painel-projetos nao e erro nenhum — e informacao — e pintar de
   vermelho o que nao e problema ensina o dono a ignorar vermelho. */
.aviso.neutro{border-color:var(--acento);color:var(--texto)}

#recado{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:var(--texto);color:var(--bg);padding:9px 16px;border-radius:8px;
  font-size:13px;max-width:min(680px,90vw);box-shadow:var(--sombra);
  opacity:0;pointer-events:none;transition:opacity .18s}
#recado.ver{opacity:1}
@media (prefers-reduced-motion:reduce){#recado{transition:none}}
</style>
</head>
<body>
<div class="env">
  <header class="topo">
    <div>
      <h1>HUB do dev</h1>
      <div class="sub" id="linhafina">carregando…</div>
    </div>
    <div class="acoes">
      <!-- O atalho precisa ser VISIVEL. Paleta que so existe no Ctrl+K e paleta
           que o dono nunca descobre — e este dono nao vive em teclado. -->
      <button class="btn busca" id="btn-paleta"
              aria-keyshortcuts="Control+K Meta+K">
        <span>Buscar projeto ou ação</span><kbd>Ctrl K</kbd>
      </button>
      <button class="btn" id="btn-tema">Tema</button>
    </div>
  </header>

  <!-- A regiao viva e SO a frase, e ela so e reescrita quando o texto muda de
       verdade. O bloco inteiro com aria-live, redesenhado a cada 15 s, faria o
       leitor de tela reanunciar frase, placar e seta em todo ciclo, tenha
       mudado algo ou nao — isso e ruido constante, nao aviso. O placar fica
       fora da regiao viva de proposito: ele repete em numero o que a frase ja
       disse em portugues. -->
  <div class="briefing" id="briefing">
    <div class="frase" id="briefing-frase" aria-live="polite"></div>
    <div class="placar" id="briefing-placar"></div>
  </div>

  <h2 class="secao">Precisa de você agora</h2>
  <div class="caixa" id="caixa"></div>

  <details class="todos" id="todos">
    <summary><span id="rot-todos">Todos os projetos</span><span></span></summary>
    <div class="rolagem">
      <table>
        <thead><tr>
          <th>Projeto</th><th>Fase</th><th>Ramo</th><th>CI</th><th>Contêineres</th>
          <th>Sem commit</th><th>Sem enviar</th><th>Última atividade</th>
          <th>Prontidão</th><th>Grafo</th><th>Medido</th>
        </tr></thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
  </details>

  <div id="falhas"></div>

  <div class="rodape" id="rodape"></div>
</div>

<!-- ------------------------------------------------------------- paleta ----
     closedby="any" + showModal() dao de graca o que se costuma escrever a mao
     e errado: foco preso dentro, Esc fechando, clique fora fechando, e camada
     acima de tudo sem guerra de z-index. O fallback do closedby esta no JS. -->
<dialog id="paleta" closedby="any" aria-label="Buscar projeto ou ação">
  <div class="p-topo">
    <input id="p-busca" type="text" role="combobox" autocomplete="off"
           spellcheck="false" aria-expanded="true" aria-controls="p-lista"
           aria-autocomplete="list" placeholder="Digite um projeto, ou o que quer fazer…">
    <kbd>Esc</kbd>
  </div>
  <ul id="p-lista" role="listbox" aria-label="Resultados"></ul>
  <div class="p-rodape">
    <span><kbd>↑</kbd><kbd>↓</kbd> escolher</span>
    <span><kbd>Enter</kbd> fazer</span>
    <span><kbd>Esc</kbd> fechar</span>
    <span id="p-conta"></span>
  </div>
</dialog>
<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
let ESTADO = null;

/* ------------------------------------------------------------------ tempo */
function haQuanto(iso){
  if(!iso) return "—";
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 0) return "agora";
  if (s < 90) return Math.round(s) + " s";
  if (s < 5400) return Math.round(s/60) + " min";
  if (s < 172800) return Math.round(s/3600) + " h";
  return Math.round(s/86400) + " d";
}
/* Cada camada tem sua propria expectativa de frescor. Passou do dobro dela, o
   numero esmaece — o dono ve que aquilo esta velho antes de confiar nele. */
const FRESCOR = {local: 120, github: 2400, pesado: 172800};
function velho(iso, camada){
  if(!iso) return true;
  return (Date.now() - Date.parse(iso))/1000 > (FRESCOR[camada]||120) * 2;
}

function recado(txt, erro){
  const el = $("#recado");
  el.textContent = txt;
  el.style.background = erro ? "var(--erro)" : "var(--texto)";
  el.style.color = "#fff";
  el.classList.add("ver");
  clearTimeout(recado._t);
  recado._t = setTimeout(() => el.classList.remove("ver"), erro ? 9000 : 4000);
}

/* ------------------------------------------------------------------ acoes */
/* Na etapa 7 do DERVS o servidor deixou de executar comando. Foram embora com
   ele o "Resolver", a fila, o grafo e os botoes que rodavam `git push`,
   `docker compose` e o VS Code. Sobrou UMA escrita: esconder um alerta. */
async function silenciar(id, horas){
  const r = await fetch("/api/silenciar", {
    method:"POST", headers:{"Content-Type":"application/json","X-Token":TOKEN},
    body: JSON.stringify({id, horas})
  });
  return r.json();
}

/* As duas acoes que sobreviveram sao as que o NAVEGADOR faz sozinho: abrir um
   link e copiar um texto. O que precisava do servidor nao vira botao, e quem
   decide isso e `temAcaoNaTela()` — um lugar so, obedecido pela caixa E pela
   paleta. Duas listas divergiriam, e a divergencia apareceria como um botao
   que nao faz nada. */
function temAcaoNaTela(pend){
  const t = pend && pend.acao && pend.acao.tipo;
  return t === "abrir_url" || t === "copiar";
}

async function agir(pend){
  const a = pend.acao;
  if (a.tipo === "abrir_url"){ window.open(a.url, "_blank", "noopener"); return; }
  if (a.tipo === "copiar"){
    try { await navigator.clipboard.writeText(a.texto); recado("Copiado."); }
    catch { recado("Não consegui copiar. O texto é: " + a.texto, true); }
    return;
  }
  recado("Esta ação saiu do painel: agora ela é feita por você, fora dele.", true);
}

async function calar(pend){
  const r = await silenciar(pend.id, 24);
  recado(r.ok ? "Escondida por 24 h." : "Não deu certo.", !r.ok);
  carregar();
}

/* --------------------------------------------------------------- o briefing */
function pecaDoPlacar(n, rotulo, classe){
  const d = document.createElement("div");
  d.className = "peca" + (classe ? " " + classe : "");
  const a = document.createElement("div");
  a.className = "n"; a.textContent = String(n);
  const b = document.createElement("div");
  b.className = "r"; b.textContent = rotulo;
  d.append(a, b);
  return d;
}

/* Sparkline em SVG puro: 60 pontos, sem biblioteca e sem requisicao. Diz a
   FORMA da semana — subindo, descendo, plana — que e o que um numero sozinho
   nao diz. Menos de dois pontos nao tem forma nenhuma: nao desenha. */
function sparkline(serie){
  const pts = (serie || []).map(x => x.valor);
  if (pts.length < 2) return null;
  const L = 96, A = 26, min = Math.min(...pts), max = Math.max(...pts);
  const faixa = (max - min) || 1;
  const x = i => (i / (pts.length - 1)) * (L - 2) + 1;
  const y = v => A - 3 - ((v - min) / faixa) * (A - 6);
  const d = pts.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1))
                .join(" ");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 " + L + " " + A);
  svg.setAttribute("width", L); svg.setAttribute("height", A);
  svg.setAttribute("class", "linha-tendencia");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label",
    "Pendências abertas nos últimos 7 dias: de " + pts[0] + " para " + pts[pts.length-1]);
  const p = document.createElementNS(svg.namespaceURI, "path");
  p.setAttribute("d", d);
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", "currentColor");
  p.setAttribute("stroke-width", "1.5");
  p.setAttribute("stroke-linejoin", "round");
  p.setAttribute("stroke-linecap", "round");
  p.setAttribute("opacity", ".55");
  svg.append(p);
  return svg;
}

let ULTIMO_BRIEFING = null;      // assinatura do que ja esta na tela

function desenhaBriefing(d){
  const t = d.tendencia || {abertas:{}};
  const ab = t.abertas || {};

  // Assinatura do conteudo. Sem ela, cada ciclo de 15 s reescreveria o mesmo
  // texto: DOM a toa, e um aria-live reanunciando o que ninguem mudou.
  const chave = JSON.stringify([d.briefing, ab.alta, t.novas_24h,
                                t.resolvidas_7d, t.direcao,
                                (t.serie || []).length]);
  if (chave === ULTIMO_BRIEFING) return;
  ULTIMO_BRIEFING = chave;

  $("#briefing").className = "briefing " + (ab.alta ? "urgente" : "calmo");
  $("#briefing-frase").textContent = d.briefing || "";

  const placar = $("#briefing-placar");
  placar.textContent = "";
  placar.append(pecaDoPlacar(ab.alta || 0, "urgentes", ab.alta ? "mal" : "bem"));
  if (t.novas_24h) placar.append(pecaDoPlacar(t.novas_24h, "novas hoje"));
  // So aparece quando ha o que comemorar. Um "0 fechadas" permanente no topo da
  // tela e uma repreensao diaria, nao uma informacao.
  if (t.resolvidas_7d)
    placar.append(pecaDoPlacar(t.resolvidas_7d, "fechadas · 7d", "bem"));

  const linha = sparkline(t.serie);
  if (linha){
    const seta = document.createElement("span");
    seta.className = "seta " + (t.direcao || "estavel");
    // Decorativa: o aria-label do sparkline ao lado ja diz a mesma tendencia em
    // palavras, e `title` nao e lido de forma confiavel nem existe no toque.
    seta.setAttribute("aria-hidden", "true");
    seta.textContent = t.direcao === "piorando" ? "▲"
                     : t.direcao === "melhorando" ? "▼" : "—";
    placar.append(linha, seta);
  }
}

/* ------------------------------------------------------------------ a caixa */
/* A idade em portugues. Silencio quando nao se sabe — nunca "0 dias", que e um
   numero, e numero errado num painel custa mais caro que numero ausente. */
function idadeEmTexto(p){
  if (p.dias === null || p.dias === undefined){
    // Idade exata desconhecida, mas a memoria sabe ha quanto tempo ELA existe:
    // a pendencia que ja estava aqui na estreia tem no minimo essa idade.
    const piso = p.dias_min || 0;
    return piso ? "aberta há mais de " + piso + (piso === 1 ? " dia" : " dias") : "";
  }
  if (p.dias === 0) return "de hoje";
  return "aberta há " + p.dias + (p.dias === 1 ? " dia" : " dias");
}

const gravDaLinha = l => l.tipo === "grupo" ? l.gravidade : l.pendencia.gravidade;
const quantasNaLinha = l => l.tipo === "grupo" ? l.n : 1;

/* Uma linha de grupo: 3+ pendencias da mesma regra dobradas numa so.
   <details> de proposito, e nao um painel escrito a mao: o Ctrl+F do navegador
   acha o que esta la dentro sem o dono precisar abrir. */
function linhaDeGrupo(g){
  const det = document.createElement("details");
  det.className = "grupo " + g.gravidade;
  const s = document.createElement("summary");

  // Sem selo de contagem ao lado: a frase JA comeca com o numero ("10 projetos
  // com..."). Repetir viraria "10x  10 projetos com...  Ver 10" — tres vezes o
  // mesmo dado na mesma linha, que e ruido com cara de organizacao.
  const txt = document.createElement("span");
  txt.className = "conta-txt";
  txt.textContent = g.texto;

  const abre = document.createElement("span");
  abre.className = "abre";
  abre.textContent = g.acao.rotulo + " ";

  s.append(txt, abre);
  det.append(s);

  const dentro = document.createElement("div");
  dentro.className = "dentro";
  itensEm(dentro, g.itens || []);
  det.append(dentro);
  return det;
}

function linhasEm(caixa, linhas){
  for (const l of linhas){
    if (l.tipo === "grupo") caixa.append(linhaDeGrupo(l));
    else itensEm(caixa, [l.pendencia]);
  }
}

function desenhaCaixa(d){
  const caixa = $("#caixa");
  caixa.textContent = "";
  const linhas = d.grupos || [];
  if (!linhas.length){
    const v = document.createElement("div");
    v.className = "limpa";
    v.innerHTML = "<b>Caixa limpa.</b> Nenhum projeto está esperando você agora.";
    caixa.append(v);
    return;
  }
  // So o urgente fica a vista. O resto entra numa gaveta fechada — 25 itens
  // empilhados sao a rolagem que faz o dono parar de abrir o painel.
  const altas = linhas.filter(l => gravDaLinha(l) === "alta");
  const resto = linhas.filter(l => gravDaLinha(l) !== "alta");
  linhasEm(caixa, altas);
  if (!altas.length){
    const v = document.createElement("div");
    v.className = "limpa";
    v.innerHTML = "<b>Nada urgente.</b> O que sobrou pode esperar.";
    caixa.append(v);
  }
  if (resto.length){
    // A contagem conta PENDENCIAS, nao linhas: o dono precisa saber que sao 21
    // coisas ali dentro, mesmo que estejam dobradas em 4 linhas.
    const quantas = resto.reduce((s, l) => s + quantasNaLinha(l), 0);
    const det = document.createElement("details");
    det.className = "todos gaveta";
    const s = document.createElement("summary");
    s.append(document.createTextNode("Mais " + quantas +
      (quantas === 1 ? " item que pode esperar" : " itens que podem esperar")));
    s.append(document.createElement("span"));
    det.append(s);
    const dentro = document.createElement("div");
    dentro.className = "caixa dentro";
    linhasEm(dentro, resto);
    det.append(dentro);
    caixa.append(det);
  }
}

function itensEm(caixa, pend){
  for (const p of pend){
    const li = document.createElement("div");
    li.className = "item " + p.gravidade;

    const corpo = document.createElement("div");
    corpo.className = "corpo";
    const txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = p.texto;
    // Nasceu nas ultimas 24 h: selo. E o unico jeito de a lista distinguir o
    // que chegou hoje do que apodrece ha semanas sem obrigar a ler as datas.
    if (p.nova){
      const selo = document.createElement("span");
      selo.className = "selo";
      selo.textContent = "nova";
      txt.append(selo);
    }
    corpo.append(txt);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (p.projeto ? p.projeto + " · " : "") + (p.detalhe || p.regra);
    const quando = idadeEmTexto(p);
    if (quando){
      meta.append(document.createTextNode(" · "));
      const i = document.createElement("span");
      // Acima de 14 dias a idade muda de cor: nesse ponto ela deixou de ser
      // informacao e virou a propria pendencia.
      i.className = "idade" + ((p.dias >= 14 || p.dias_min >= 14) ? " velha" : "");
      i.textContent = quando;
      meta.append(i);
    }
    corpo.append(meta);
    li.append(corpo);

    const botoes = document.createElement("div");
    botoes.className = "botoes";
    if (temAcaoNaTela(p)){
      const b = document.createElement("button");
      b.className = "agir";
      b.textContent = p.acao.rotulo;
      b.addEventListener("click", () => agir(p));
      botoes.append(b);
    }

    const c = document.createElement("button");
    c.className = "calar";
    c.title = "Esconder por 24 horas";
    c.textContent = "×";
    c.addEventListener("click", () => calar(p));
    botoes.append(c);
    li.append(botoes);
    caixa.append(li);
  }
}

/* ----------------------------------------------------------------- a tabela */
function celula(texto, classe){
  const td = document.createElement("td");
  if (classe) td.className = classe;
  td.textContent = texto;
  return td;
}

function ciTexto(p){
  const gh = p.github;
  if (!gh) return "—";
  const c = gh.ci || {};
  if (c.conclusao === "failure") return "falhou";
  if (c.conclusao === "success") return "passou";
  return c.estado_bruto ? c.estado_bruto.toLowerCase() : "sem CI";
}

/* ------------------------------------------------------- conta da prontidão
   A nota aparecia como um número solto ("64%", em vermelho) e nada mais. Número
   sem conta não é medida: é acusação. Clicar abre a lista dos critérios em três
   estados — feito, falta, e NÃO SE APLICA, que é o estado que faltava existir.  */
function pecaDoCriterio(i){
  const el = document.createElement("span");
  // "não se aplica" e "não consegui medir" sao coisas opostas: a primeira diz
  // que o criterio nao cabe a este projeto, a segunda que ele cabe e eu fiquei
  // cega. Confundir as duas era conceder em silencio o ponto de segurança.
  const estado = i.nao_medido ? "nm" : !i.aplica ? "na" : i.ok ? "ok" : "mal";
  el.className = "peca " + estado;
  el.textContent = (estado === "ok" ? "✓ " : estado === "mal" ? "✗ " : estado === "nm" ? "? " : "— ") + i.rotulo;
  const nota = document.createElement("i");
  nota.textContent = i.nao_medido
    ? "não consegui medir"
    : !i.aplica
    ? (i.manual ? "desligado por você" : "não se aplica")
    : (i.manual ? i.peso + " pt · exigido por você" : i.peso + " pt");
  el.append(nota);
  return el;
}

function linhaDaConta(pr){
  const tr = document.createElement("tr");
  tr.className = "conta";
  const td = document.createElement("td");
  td.colSpan = 11;

  const caixa = document.createElement("div");
  caixa.className = "pecas";
  for (const i of pr.itens || []) caixa.append(pecaDoCriterio(i));
  td.append(caixa);

  const fora = (pr.itens || []).filter(i => !i.aplica && !i.nao_medido).length;
  const cego = (pr.nao_medido || []).length;
  const p = document.createElement("p");
  p.className = "tenue";
  p.textContent = pr.pontos + " de " + pr.total + " pontos aplicáveis"
    + (fora ? " · " + fora + " critério(s) não entram na conta deste projeto" : "")
    + (cego ? " · " + cego + " critério(s) ficaram SEM VEREDITO: não consegui medir" : "")
    + " · ajuste em casos.json → \"prontidao\"";
  td.append(p);

  tr.append(td);
  return tr;
}

/* A tabela inteira e redesenhada de 15 em 15 segundos (setInterval la embaixo).
   Sem esta lista, a gaveta que o dono acabou de abrir fechava sozinha na cara
   dele no meio da leitura. Guardamos por NOME do projeto, nao por elemento:
   os elementos morrem a cada redesenho, o nome sobrevive. */
const CONTAS_ABERTAS = new Set();

function celulaProntidao(pr, linha, nome){
  const td = document.createElement("td");
  td.className = "num pt " + (pr.pct >= 80 ? "" : pr.pct >= 55 ? "meio" : "mal");
  if (pr.pct == null){ td.textContent = "—"; return td; }

  const b = document.createElement("button");
  b.className = "conta-btn";
  b.textContent = pr.pct + "%";
  b.setAttribute("aria-expanded", String(CONTAS_ABERTAS.has(nome)));
  // Nota com criterio sem veredito nao e a mesma nota. O asterisco e o aviso
  // de que ela foi calculada sobre menos do que deveria.
  const faltam = (pr.nao_medido || []).length;
  if (faltam){
    b.textContent = pr.pct + "%*";
    b.title = "nota parcial: " + faltam + " critério(s) não pude medir";
  } else {
    b.title = "Ver de que é feita esta nota";
  }
  b.onclick = () => {
    const conta = linha.nextElementSibling;
    if (conta && conta.classList.contains("conta")){
      conta.remove();
      CONTAS_ABERTAS.delete(nome);
      b.setAttribute("aria-expanded", "false");
    } else {
      linha.after(linhaDaConta(pr));
      CONTAS_ABERTAS.add(nome);
      b.setAttribute("aria-expanded", "true");
    }
  };
  td.append(b);
  return td;
}

function desenhaTabela(projetos){
  const tb = $("#linhas");
  tb.textContent = "";
  for (const p of projetos){
    const g = p.git || {}, pr = p.prontidao || {};
    const tr = document.createElement("tr");
    tr.append(celula(p.nome, "nome"));
    tr.append(celula(p.fase || "—", "tenue"));
    // Git que nao respondeu: "—" mentiria de novo (parece "nao tem"), e 0
    // mentiria pior (parece medido). "?" com explicacao ao passar o mouse.
    const semGit = g.medido === false;
    const nm = (classe) => {
      const td = celula("?", (classe || "") + " nao-medi");
      td.title = "não consegui ler o git deste projeto — nada aqui foi medido";
      return td;
    };
    tr.append(semGit ? nm("tenue") : celula(g.branch || "—", "tenue"));

    const ci = celula(ciTexto(p));
    if (ciTexto(p) === "falhou") ci.style.color = "var(--erro)";
    else if (ciTexto(p) === "passou") ci.style.color = "var(--ok)";
    else ci.className = "tenue";
    tr.append(ci);

    // Quantos containers SAUDAVEIS o projeto tem agora. containers_esperados e
    // uma lista de nomes a casar, nao uma quantidade — mostrar "10/1" mentia.
    const vivos = (p.containers||[]).filter(c => c.saudavel && !c.reiniciando).length;
    const esperaContainer = (p.containers_esperados||[]).length > 0;
    const cel = celula(vivos || (esperaContainer ? "0" : "—"), "num");
    if (esperaContainer && !vivos && p.aberto_no_editor) cel.style.color = "var(--erro)";
    else cel.classList.add("tenue");
    tr.append(cel);

    if (semGit){
      tr.append(nm("num")); tr.append(nm("num")); tr.append(nm("num"));
    } else {
      tr.append(celula(g.sujos || "—", "num"));
      tr.append(celula(g.ahead || "—", "num"));
      tr.append(celula(g.dias_parado != null ? g.dias_parado + " d" : "—", "num tenue"));
    }

    tr.append(celulaProntidao(pr, tr, p.nome));

    const gr = p.grafo || {};
    tr.append(celula(gr.indexado ? gr.dias + " d" : "sem", "num tenue"));

    const carimbo = celula(haQuanto((p.medido_em||{}).local), "num tenue");
    if (velho((p.medido_em||{}).local, "local")) carimbo.classList.add("velho");
    tr.append(carimbo);
    tb.append(tr);
    // Reabre a conta que o dono ja tinha aberto antes deste redesenho.
    if (CONTAS_ABERTAS.has(p.nome)) tb.append(linhaDaConta(pr));
  }
  $("#rot-todos").textContent = "Todos os projetos (" + projetos.length + ")";
}

/* ---------------------------------------------------------------- carregar */
async function carregar(){
  let d;
  try { d = await (await fetch("/api/dados")).json(); }
  catch(e){ $("#linhafina").textContent = "servidor fora do ar — " + e.message; return; }
  ESTADO = d;

  desenhaBriefing(d);
  desenhaCaixa(d);
  desenhaTabela(d.projetos);

  const altas = d.pendencias.filter(p => p.gravidade === "alta").length;
  $("#linhafina").textContent =
    d.projetos.length + " projetos · " + d.pendencias.length + " pendência(s), "
    + altas + " urgente(s) · git medido há " + haQuanto(d.infra_medido_em);

  const q = d.quota;
  const inf = d.infra || {};
  $("#rodape").textContent =
    // Mesmo tratamento das portas: Docker mudo nao pode virar "0 contêineres".
    (inf.docker_mudo ? "contêineres: não medido · "
                       : (inf.containers||[]).length + " contêineres · ")
    // null = o coletor nao conseguiu medir. "0 portas" seria mentira com cara
    // de medicao: o rodape diz que nao sabe, e nao um numero inventado.
    + (inf.portas == null ? "portas: não medido" : inf.portas.length + " portas escutando")
    + (q ? " · Actions " + q.pct + "% de " + q.cota + " min" : "");

  const falhas = $("#falhas");
  falhas.textContent = "";
  for (const [camada, erro] of Object.entries(d.falhas_de_coleta || {})){
    const div = document.createElement("div");
    div.className = "aviso";
    div.textContent = "A coleta da camada " + camada + " falhou — os números dela "
      + "estão velhos, não zerados. Motivo: " + erro;
    falhas.append(div);
  }
}

/* --------------------------------------------------------- paleta (Ctrl+K)
   Porta de entrada unica: digitar "dents" e cair no projeto, digitar "subir" e
   subir o contêiner. Com 17 repositorios, menu em arvore vira caca ao tesouro.

   Implementacao propria de proposito: o projeto e sem build e sem dependencia,
   e cmdk/kbar custariam as duas coisas por ~200 linhas que sabemos escrever.

   A paleta NAO tem acao propria nenhuma. Ela so encontra e dispara o que ja
   existe — mesmo `agir()`, mesma lista branca do servidor. Se ela pudesse
   fazer algo que a tela nao faz, viraria uma segunda superficie de risco para
   revisar; assim, o que vale para a caixa vale para ela, de graca. */
const paleta = $("#paleta"), pBusca = $("#p-busca"), pLista = $("#p-lista");
let pItens = [], pAtivo = 0;

/* "Ajudei-Saúde" tem de casar com "ajudei saude": sem isso o dono digita o
   nome do projeto dele, sem acento e sem hifen, e a paleta responde "nada". */
const semAcento = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
  .toLowerCase().replace(/[-_./]+/g, " ").trim();

function pontua(alvo, termo){
  if (!termo) return 1;
  const a = semAcento(alvo), t = semAcento(termo);
  if (a === t) return 1000;
  if (a.startsWith(t)) return 500 - a.length;
  const i = a.indexOf(t);
  if (i >= 0) return 300 - i;
  // Ultimo recurso: as letras aparecem na ordem ("wsmed" acha "workspace-
  // medconsultoria"). Vale menos que qualquer casamento literal.
  let j = 0;
  for (const c of a) if (c === t[j]) j++;
  return j === t.length ? 40 : -1;
}

/* Um comando = rotulo, subtitulo, selo e o que fazer.
   `chave` e o nome cru do projeto, so no comando de abrir: e o que faz "digitar
   dents e cair no projeto" (a especificacao) vencer a pendencia do dents, que
   tambem tem "dents" no meio do texto. Vale so para nome digitado inteiro ou
   pelo comeco — em busca por letras soltas a pendencia continua ganhando, que e
   o certo: ali o dono nao sabe o nome, esta procurando o que precisa dele. */
function cmd(rot, sub, selo, faz, classe, chave){
  return {rot, sub, selo, faz, classe: classe || "", chave: chave || ""};
}
const BONUS_NOME = 400;

function comandosDe(d){
  const c = [];

  // 1. As pendencias primeiro: e a pergunta que o HUB existe para responder.
  //    So as que ainda tem acao de tela. A paleta nao pode oferecer o que o
  //    botao nao oferece mais — senao ela vira exatamente a porta dos fundos
  //    que o bloco acima jura nao ser.
  for (const p of d.pendencias || []){
    if (!temAcaoNaTela(p)) continue;
    c.push(cmd(p.acao.rotulo + ": " + p.texto, p.projeto || "a máquina",
               p.gravidade === "alta" ? "urgente" : "pendência",
               () => agir(p), p.gravidade));
  }

  // 2. Um projeto = varias portas de entrada. So entram as que EXISTEM: item
  //    que abre nada e pior que item ausente.
  for (const p of d.projetos || []){
    const g = p.git || {};
    // "Abrir no VS Code", "Subir os conteineres" e "Enviar ao GitHub" moravam
    // aqui e sairam na etapa 7: os tres rodavam programa na maquina do dono.
    // O que sobrou abre link, e link o navegador abre sozinho.
    if (g.remoto_slug)
      c.push(cmd("Abrir " + p.nome + " no GitHub", g.remoto_slug, "site",
                 () => window.open("https://github.com/" + g.remoto_slug,
                                   "_blank", "noopener")));
    if (p.url_prod)
      c.push(cmd("Abrir o site no ar do " + p.nome, p.url_prod, "produção",
                 () => window.open(p.url_prod, "_blank", "noopener")));
    for (const porta of (p.portas || []))
      if (porta.vivo)
        c.push(cmd("Abrir " + p.nome + " local", "porta " + porta.porta, "local",
                   () => window.open("http://localhost:" + porta.porta,
                                     "_blank", "noopener")));
  }

  // 3. Comandos da maquina inteira. "Medir agora" e "Atualizar o GitHub"
  //    sairam na etapa 7 (os dois disparavam um coletor). As tres camadas
  //    seguem rodando sozinhas: 60 s, 20 min e 24 h.
  c.push(cmd("Trocar o tema (claro / escuro)", "", "hub",
             () => $("#btn-tema").click()));
  return c;
}

function desenhaPaleta(){
  const termo = pBusca.value.trim();
  const todos = comandosDe(ESTADO || {});
  pItens = todos
    .map(x => {
      const nome = x.chave ? pontua(x.chave, termo) : -1;
      return {x, n: Math.max(
        pontua(x.rot, termo),
        pontua(x.sub, termo) - 60,
        nome >= 500 ? nome + BONUS_NOME : -1)};   // >=500 = nome inteiro ou inicio
    })
    .filter(v => v.n > 0)
    .sort((a, b) => b.n - a.n)
    .slice(0, 50)
    .map(v => v.x);

  pAtivo = 0;
  pLista.textContent = "";
  if (!pItens.length){
    const li = document.createElement("li");
    li.className = "vazio";
    li.textContent = "Nada encontrado para “" + termo + "”.";
    pLista.append(li);
    pBusca.removeAttribute("aria-activedescendant");
    $("#p-conta").textContent = "0 de " + todos.length;
    return;
  }
  pItens.forEach((it, i) => {
    const li = document.createElement("li");
    li.id = "p-op-" + i;
    li.setAttribute("role", "option");
    li.className = it.classe;
    li.setAttribute("aria-selected", i === 0 ? "true" : "false");
    const r = document.createElement("span"); r.className = "rot"; r.textContent = it.rot;
    const s = document.createElement("span"); s.className = "sub"; s.textContent = it.sub;
    const e = document.createElement("span"); e.className = "selo"; e.textContent = it.selo;
    li.append(r, s, e);
    li.addEventListener("click", () => roda(i));
    pLista.append(li);
  });
  pBusca.setAttribute("aria-activedescendant", "p-op-0");
  $("#p-conta").textContent = pItens.length + " de " + todos.length;
}

function move(delta){
  if (!pItens.length) return;
  const li = pLista.children;
  li[pAtivo].setAttribute("aria-selected", "false");
  pAtivo = (pAtivo + delta + pItens.length) % pItens.length;
  li[pAtivo].setAttribute("aria-selected", "true");
  li[pAtivo].scrollIntoView({block: "nearest"});
  pBusca.setAttribute("aria-activedescendant", "p-op-" + pAtivo);
}

function roda(i){
  const it = pItens[i];
  if (!it) return;
  paleta.close();          // fecha ANTES: acao que abre aba ou janela precisa
  it.faz();                // da paleta fora do caminho.
}

function abrePaleta(){
  if (paleta.open) return;
  pBusca.value = "";
  desenhaPaleta();
  paleta.showModal();      // showModal: foco preso, Esc e camada de topo nativos
  pBusca.focus();
}

$("#btn-paleta").addEventListener("click", abrePaleta);
pBusca.addEventListener("input", desenhaPaleta);
pBusca.addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ e.preventDefault(); move(1); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); move(-1); }
  else if (e.key === "Home"){ e.preventDefault(); move(-pAtivo); }
  else if (e.key === "End"){ e.preventDefault(); move(pItens.length - 1 - pAtivo); }
  else if (e.key === "Enter"){ e.preventDefault(); roda(pAtivo); }
});

document.addEventListener("keydown", e => {
  // Ctrl+K no Windows, Cmd+K no Mac. Sem o preventDefault o Chrome leva o foco
  // para a barra de endereco e a paleta abre atras dela.
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
    e.preventDefault();
    paleta.open ? paleta.close() : abrePaleta();
  }
});

if (!("closedBy" in HTMLDialogElement.prototype)){
  paleta.addEventListener("click", e => {
    if (e.target !== paleta) return;      // clique num filho: nao e o fundo
    const r = paleta.getBoundingClientRect();
    const dentro = r.top <= e.clientY && e.clientY <= r.top + r.height
                && r.left <= e.clientX && e.clientX <= r.left + r.width;
    if (!dentro) paleta.close();
  });
}

carregar();

setInterval(carregar, 15000);
</script>
