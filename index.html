<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Projetos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233b6ef5'/%3E%3Crect x='3' y='8' width='2.4' height='5' fill='white'/%3E%3Crect x='6.8' y='5' width='2.4' height='8' fill='white'/%3E%3Crect x='10.6' y='3' width='2.4' height='10' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --painel:#fff; --borda:#e2e5ea; --texto:#12151a; --fraco:#5f6672;
  --fraquinho:#8b93a1; --acento:#3b6ef5; --ok:#1a8a52; --alerta:#b8720b; --erro:#c8382f;
  --grade:#eceff3; --sombra:0 1px 2px rgba(16,20,28,.06),0 4px 14px rgba(16,20,28,.05);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1014; --painel:#151a21; --borda:#252c36; --texto:#e6eaf0; --fraco:#98a1af;
  --fraquinho:#6b7482; --acento:#6f97ff; --ok:#3fbb7a; --alerta:#e0a038; --erro:#ef6b60;
  --grade:#1c222b; --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --bg:#0d1014; --painel:#151a21; --borda:#252c36; --texto:#e6eaf0; --fraco:#98a1af;
  --fraquinho:#6b7482; --acento:#6f97ff; --ok:#3fbb7a; --alerta:#e0a038; --erro:#ef6b60;
  --grade:#1c222b; --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--acento)}
.env{max-width:1500px;margin:0 auto;padding:20px 22px 80px}

/* ---------------------------------------------------------------- cabecalho */
header.topo{display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:21px;margin:0;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--fraco);font-size:12.5px;margin-top:3px}
.pulso{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:11.5px;color:var(--fraco)}
.bolha{width:7px;height:7px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 0 0 rgba(63,187,122,.6);animation:bate 2.4s infinite}
@keyframes bate{0%{box-shadow:0 0 0 0 rgba(63,187,122,.5)}70%{box-shadow:0 0 0 7px rgba(63,187,122,0)}100%{box-shadow:0 0 0 0 rgba(63,187,122,0)}}
@media (prefers-reduced-motion:reduce){.bolha{animation:none}}
.acoes{display:flex;gap:8px;align-items:center}
button.btn{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:7px;
  border:1px solid var(--borda);background:var(--painel);color:var(--texto);cursor:pointer}
button.btn:hover{border-color:var(--acento)}

/* ------------------------------------------------------------------ resumo */
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  gap:10px;margin-bottom:16px}
.kpi{background:var(--painel);border:1px solid var(--borda);border-radius:10px;
  padding:11px 13px;box-shadow:var(--sombra)}
.kpi .n{font-size:23px;font-weight:640;font-family:var(--mono);letter-spacing:-.03em}
.kpi .r{font-size:11px;color:var(--fraco);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}

/* ------------------------------------------------------------------ alertas */
.alertas{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.alerta{display:flex;gap:10px;align-items:flex-start;background:var(--painel);
  border:1px solid var(--borda);border-left:3px solid var(--alerta);
  border-radius:8px;padding:9px 13px;font-size:13px}
.alerta.grave{border-left-color:var(--erro)}
.alerta b{font-weight:600}
.alerta .como{color:var(--fraco);font-size:12.5px}
code{font-family:var(--mono);font-size:12px;background:var(--grade);
  padding:1px 5px;border-radius:4px}

/* ------------------------------------------------------------------ filtros */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filtros input,.filtros select{font:inherit;font-size:12.5px;padding:6px 10px;
  border-radius:7px;border:1px solid var(--borda);background:var(--painel);color:var(--texto)}
.filtros input{min-width:190px}
.chip{font-size:11.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--borda);
  background:var(--painel);color:var(--fraco);cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#fff}

/* -------------------------------------------------------------------- cards */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--painel);border:1px solid var(--borda);border-radius:11px;
  padding:14px 15px;box-shadow:var(--sombra);cursor:pointer;position:relative;
  transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--acento);transform:translateY(-1px)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.card .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{margin:0;font-size:15px;font-weight:620;letter-spacing:-.01em}
.card .slug{font-family:var(--mono);font-size:11px;color:var(--fraquinho);margin-top:1px}
.tag{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.04em;border:1px solid transparent}
.f-Operação{background:rgba(63,187,122,.14);color:var(--ok);border-color:rgba(63,187,122,.3)}
.f-Manutenção{background:rgba(59,110,245,.13);color:var(--acento);border-color:rgba(59,110,245,.28)}
.f-Estabilização{background:rgba(224,160,56,.14);color:var(--alerta);border-color:rgba(224,160,56,.3)}
.f-Construção{background:rgba(59,110,245,.1);color:var(--acento);border-color:rgba(59,110,245,.22)}
.f-Hibernando{background:var(--grade);color:var(--fraco);border-color:var(--borda)}
.f-Rascunho{background:var(--grade);color:var(--fraquinho);border-color:var(--borda)}
.resumo-txt{font-size:12.5px;color:var(--fraco);margin:9px 0 11px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.barra{height:6px;border-radius:4px;background:var(--grade);overflow:hidden;margin-bottom:5px}
.barra i{display:block;height:100%;border-radius:4px;background:var(--acento)}
.barra i.b-ok{background:var(--ok)} .barra i.b-al{background:var(--alerta)}
.linha-pct{display:flex;justify-content:space-between;font-size:11.5px;color:var(--fraco);
  font-family:var(--mono);margin-bottom:11px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  border-top:1px solid var(--borda);padding-top:10px}
.mini div{min-width:0}
.mini .v{font-family:var(--mono);font-size:14px;font-weight:600}
.mini .l{font-size:10.5px;color:var(--fraquinho);text-transform:uppercase;letter-spacing:.04em}
.spark{margin-top:10px;display:block;width:100%;height:26px}
.pes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pastilha{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;
  background:var(--grade);color:var(--fraco);display:inline-flex;align-items:center;gap:5px}
.pt{width:6px;height:6px;border-radius:50%;background:var(--fraquinho)}
.pt.on{background:var(--ok)} .pt.off{background:var(--erro)}
.risco-mini{margin-top:9px;font-size:11.5px;color:var(--alerta)}

/* ------------------------------------------------------------------ detalhe */
dialog{border:none;border-radius:13px;padding:0;max-width:820px;width:calc(100% - 32px);
  background:var(--painel);color:var(--texto);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(8,10,14,.55)}
.dcab{padding:18px 22px;border-bottom:1px solid var(--borda);position:sticky;top:0;
  background:var(--painel);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.dcorpo{padding:18px 22px 24px;max-height:min(72vh,760px);overflow-y:auto}
.secao{margin-bottom:20px}
.secao h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--fraquinho);
  margin:0 0 9px;font-weight:620}
.tabela{width:100%;border-collapse:collapse;font-size:13px}
.tabela td{padding:6px 0;border-bottom:1px solid var(--grade);vertical-align:top}
.tabela td:first-child{color:var(--fraco);width:30%;padding-right:14px}
.tabela tr:last-child td{border-bottom:none}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.chk span{font-size:12.5px;display:flex;gap:7px;align-items:center;color:var(--fraco)}
.chk span.sim{color:var(--texto)}
.mk{width:15px;text-align:center;font-weight:700}
.mk.sim{color:var(--ok)} .mk.nao{color:var(--erro)}
.caso p{margin:0 0 10px;font-size:13.5px}
.caso p b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--fraquinho);margin-bottom:2px;font-weight:620}
.langs{display:flex;height:8px;border-radius:5px;overflow:hidden;margin-bottom:8px}
.langs i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--fraco);font-family:var(--mono)}
.leg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

/* -------------------------------------------------------------------- infra */
.infra{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.cbox{background:var(--painel);border:1px solid var(--borda);border-radius:9px;padding:9px 12px;
  font-size:12.5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.cbox.ruim{border-color:var(--erro)}
.cbox .n{font-family:var(--mono);font-size:12px}
.cbox .s{font-size:11px;color:var(--fraco)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--fraquinho);
  margin:30px 0 11px;font-weight:620}
.nota{font-size:12px;color:var(--fraquinho);margin-top:10px;line-height:1.6}
.vazio{color:var(--fraco);font-size:13px;padding:26px;text-align:center;
  border:1px dashed var(--borda);border-radius:10px}

/* ------------------------------------------------------------------ roadmap */
.road{background:var(--painel);border:1px solid var(--borda);border-radius:11px;
  padding:14px 16px;box-shadow:var(--sombra);overflow-x:auto}
.road table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.road th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--fraquinho);font-weight:620;padding:0 10px 7px 0;white-space:nowrap}
.road td{padding:7px 10px 7px 0;border-top:1px solid var(--grade)}
.road .trilho{width:100%;min-width:130px;height:7px;background:var(--grade);border-radius:4px;position:relative}
.road .trilho i{position:absolute;top:0;left:0;height:100%;border-radius:4px;background:var(--acento);opacity:.85}
</style>
</head>
<body>
<div class="env">

<header class="topo">
  <div>
    <h1>Painel de Projetos</h1>
    <div class="sub">
      <span class="pulso"><span class="bolha" id="bolha"></span><span id="carimbo">carregando…</span></span>
      · <span id="fonte">C:\Users\Desktop\source\repos</span>
    </div>
  </div>
  <div class="acoes">
    <button class="btn" id="btn-tema">tema</button>
    <button class="btn" id="btn-agora">recoletar agora</button>
  </div>
</header>

<div class="resumo" id="kpis"></div>
<div class="alertas" id="alertas"></div>

<div class="filtros">
  <input id="busca" type="search" placeholder="filtrar por nome ou descrição…" autocomplete="off">
  <select id="ordem">
    <option value="atividade">ordenar: atividade recente</option>
    <option value="prontidao">ordenar: prontidão</option>
    <option value="risco">ordenar: mais riscos</option>
    <option value="tamanho">ordenar: tamanho</option>
    <option value="nome">ordenar: nome</option>
  </select>
  <span id="chips"></span>
</div>

<div class="grade" id="grade"></div>

<h2 class="sec">Projeção de entrega</h2>
<div class="road" id="road"></div>
<div class="nota" id="metodo"></div>

<h2 class="sec">Infraestrutura ao vivo</h2>
<div class="infra" id="infra"></div>
<div class="nota" id="portas"></div>

</div>

<dialog id="dlg">
  <div class="dcab">
    <div>
      <h1 id="d-titulo" style="font-size:18px">—</h1>
      <div class="slug" id="d-slug" style="font-family:var(--mono);font-size:11.5px;color:var(--fraquinho)"></div>
    </div>
    <button class="btn" onclick="document.getElementById('dlg').close()">fechar</button>
  </div>
  <div class="dcorpo" id="d-corpo"></div>
</dialog>

<script>
const CORES_LANG = ['#3b6ef5','#3fbb7a','#e0a038','#a06ff0','#ef6b60','#3aa8c1'];
const FASES = ['Operação','Manutenção','Estabilização','Construção','Hibernando','Rascunho'];
let DADOS = null, FASE_ATIVA = null;

const num = n => (n ?? 0).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function quando(iso){
  if(!iso) return '—';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if(d <= 0) return 'hoje';
  if(d === 1) return 'ontem';
  if(d < 30) return `há ${d} dias`;
  if(d < 365) return `há ${Math.round(d/30)} meses`;
  return `há ${(d/365).toFixed(1)} anos`;
}

async function carregar(forcar){
  try{
    const r = await fetch('api/dados?_=' + Date.now() + (forcar ? '&recoletar=1' : ''),
                          {cache:'no-store'});
    DADOS = await r.json();
    document.getElementById('bolha').style.background = 'var(--ok)';
    desenhar();
  }catch(e){
    document.getElementById('bolha').style.background = 'var(--erro)';
    document.getElementById('carimbo').textContent = 'sem contato com o coletor';
  }
}

/* ------------------------------------------------------------------ sparkline */
function spark(sem){
  const max = Math.max(1, ...sem), L = sem.length, W = 100, H = 26;
  const barra = W / L;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">` +
    sem.map((v,i) => {
      const h = Math.max(v ? 1.5 : 0.7, (v/max) * (H-2));
      const cor = v ? 'var(--acento)' : 'var(--grade)';
      return `<rect x="${(i*barra).toFixed(2)}" y="${(H-h).toFixed(2)}" width="${(barra*.78).toFixed(2)}" height="${h.toFixed(2)}" fill="${cor}" rx=".6"/>`;
    }).join('') + '</svg>';
}

/* ---------------------------------------------------------------------- KPIs */
function kpis(ps, infra){
  const ativos = ps.filter(p => (p.git.dias_parado ?? 999) <= 14).length;
  const commits30 = ps.reduce((s,p) => s + (p.git.commits_30d||0), 0);
  const linhas = ps.reduce((s,p) => s + p.arquivos.linhas, 0);
  const riscos = ps.reduce((s,p) => s + (p.projecao.riscos||[]).length, 0);
  const media = Math.round(ps.reduce((s,p)=>s+p.prontidao.pct,0) / ps.length);
  const conts = infra.containers.filter(c => !c.reiniciando).length;
  return [
    ['projetos', ps.length], ['ativos (14d)', ativos], ['commits/30d', commits30],
    ['prontidão média', media + '%'], ['linhas de código', num(linhas)],
    ['containers no ar', conts], ['riscos abertos', riscos],
  ].map(([r,n]) => `<div class="kpi"><div class="n">${n}</div><div class="r">${r}</div></div>`).join('');
}

/* ------------------------------------------------------------------- alertas */
function alertas(ps, infra){
  const out = [];
  infra.quebrados.forEach(n => out.push([true,
    `Container <code>${esc(n)}</code> em ciclo de reinício.`,
    `Ver a causa: <code>docker logs ${esc(n)} --tail 50</code>`]));
  ps.filter(p => p.git.ahead > 0).forEach(p => out.push([true,
    `<b>${esc(p.titulo)}</b>: ${p.git.ahead} commit(s) existem só neste disco.`,
    `Enviar: <code>git -C "${esc(p.caminho)}" push</code>`]));
  ps.filter(p => p.git.sujos > 0).forEach(p => out.push([false,
    `<b>${esc(p.titulo)}</b>: ${p.git.sujos} arquivo(s) sem commit — ${esc(p.git.sujos_lista.join(', '))}`,
    `Decidir: commitar ou <code>git restore</code>`]));
  ps.filter(p => !p.git.versionado).forEach(p => out.push([false,
    `<b>${esc(p.titulo)}</b> está fora do controle de versão.`,
    `Sem histórico, sem volta atrás. Vale <code>git init</code> ou apagar.`]));
  ps.filter(p => p.prontidao.itens.some(i => i.chave==='segredo' && !i.ok)).forEach(p => out.push([true,
    `<b>${esc(p.titulo)}</b>: arquivo de variáveis de ambiente na raiz do repositório.`,
    `Confirmar que está no <code>.gitignore</code> — nunca versionar segredo.`]));
  if(!out.length) return `<div class="alerta" style="border-left-color:var(--ok)">
    <span>✓</span><div>Nada pedindo atenção: tudo commitado, enviado e no ar.</div></div>`;
  return out.map(([grave,t,c]) => `<div class="alerta${grave?' grave':''}">
    <span>${grave?'▲':'•'}</span><div>${t}<div class="como">${c}</div></div></div>`).join('');
}

/* --------------------------------------------------------------------- cards */
function card(p){
  const g = p.git, pj = p.projecao, pr = p.prontidao;
  const cls = pr.pct >= 85 ? 'b-ok' : pr.pct >= 60 ? 'b-al' : '';
  const portas = (p.portas||[]).map(x =>
    `<span class="pastilha"><i class="pt ${x.vivo?'on':'off'}"></i>${x.porta}</span>`).join('');
  const conts = p.containers.length
    ? `<span class="pastilha"><i class="pt ${p.containers.every(c=>c.saudavel)?'on':'off'}"></i>${p.containers.length} container(s)</span>` : '';
  const prod = p.url_prod ? `<span class="pastilha">🌐 produção</span>` : '';
  const riscos = (pj.riscos||[]);
  return `<article class="card" data-nome="${esc(p.nome)}" tabindex="0">
    <div class="cab">
      <div style="min-width:0">
        <h3>${esc(p.titulo)}</h3>
        <div class="slug">${esc(p.nome)} · ${esc(g.branch||'sem git')}</div>
      </div>
      <span class="tag f-${esc(p.fase)}">${esc(p.fase)}</span>
    </div>
    <p class="resumo-txt">${esc(p.resumo || 'Sem descrição — o repositório não traz README.')}</p>
    <div class="barra"><i class="${cls}" style="width:${pr.pct}%"></i></div>
    <div class="linha-pct"><span>prontidão ${pr.pct}%</span><span>${pr.pontos}/${pr.total} pts</span></div>
    <div class="mini">
      <div><div class="v">${num(g.commits_total)}</div><div class="l">commits</div></div>
      <div><div class="v">${quando(g.ultimo_iso).replace('há ','')}</div><div class="l">último toque</div></div>
      <div><div class="v">${pj.velocidade_4s ?? '—'}</div><div class="l">commits/sem</div></div>
    </div>
    ${g.semanas ? spark(g.semanas) : ''}
    <div class="pes">${prod}${conts}${portas}
      <span class="pastilha">${esc(pj.tendencia||'—')}</span></div>
    ${riscos.length ? `<div class="risco-mini">▲ ${esc(riscos.slice(0,2).join(' · '))}${riscos.length>2?` +${riscos.length-2}`:''}</div>`:''}
  </article>`;
}

/* ------------------------------------------------------------------- detalhe */
function detalhe(p){
  const g = p.git, pj = p.projecao, pr = p.prontidao, c = p.caso || {};
  document.getElementById('d-titulo').textContent = p.titulo;
  document.getElementById('d-slug').textContent = p.caminho;

  const total = p.arquivos.linhas || 1;
  const langs = p.arquivos.linguagens.map((l,i) =>
    `<i style="width:${(100*l.linhas/total).toFixed(1)}%;background:${CORES_LANG[i%6]}"></i>`).join('');
  const leg = p.arquivos.linguagens.map((l,i) =>
    `<span><i style="background:${CORES_LANG[i%6]}"></i>${esc(l.nome)} ${num(l.linhas)}</span>`).join('');

  const casoHtml = [
    ['Quem usa', c.publico], ['A dor', c.dor], ['O que entrega', c.proposta],
    ['Por que vale', c.valor], ['Onde dói se der errado', c.risco],
    ['Como medir sucesso', c.metrica],
  ].filter(([,v]) => v && v !== '—')
   .map(([r,v]) => `<p><b>${r}</b>${esc(v)}</p>`).join('') ||
   '<p style="color:var(--fraco)">Caso de uso não descrito ainda. Editável em <code>casos.json</code>.</p>';

  const eta = pj.eta || {};
  const etaTxt = eta.semanas === 0 ? 'checklist completo'
    : eta.data ? `${eta.data} · ~${eta.semanas} semana(s) · confiança ${eta.confianca}`
    : 'sem base para estimar (nenhum commit nas últimas 4 semanas)';

  document.getElementById('d-corpo').innerHTML = `
  <div class="secao"><p style="margin:0;font-size:13.5px;color:var(--fraco)">${esc(p.resumo||'—')}</p></div>

  <div class="secao"><h4>Estudo de caso</h4><div class="caso">${casoHtml}</div></div>

  <div class="secao"><h4>Situação em números</h4>
    <table class="tabela">
      <tr><td>Fase</td><td><span class="tag f-${esc(p.fase)}">${esc(p.fase)}</span></td></tr>
      <tr><td>Branch</td><td><code>${esc(g.branch||'—')}</code> · ${g.branches||0} branch(es) · ${g.tags||0} tag(s)${g.ultima_tag?` · última <code>${esc(g.ultima_tag)}</code>`:''}</td></tr>
      <tr><td>Commits</td><td>${num(g.commits_total)} no total · ${g.commits_7d} em 7d · ${g.commits_30d} em 30d · ${g.commits_90d} em 90d</td></tr>
      <tr><td>Último commit</td><td>${quando(g.ultimo_iso)} — “${esc(g.ultimo_msg||'')}”</td></tr>
      <tr><td>Idade</td><td>${g.idade_dias!=null?`${num(g.idade_dias)} dias desde o primeiro commit`:'—'}</td></tr>
      <tr><td>Árvore</td><td>${g.sujos?`<span style="color:var(--alerta)">${g.sujos} arquivo(s) sem commit</span>`:'limpa'}${g.ahead?` · <span style="color:var(--erro)">${g.ahead} commit(s) não enviados</span>`:' · tudo enviado'}</td></tr>
      <tr><td>Código</td><td>${num(p.arquivos.linhas)} linhas · ${num(p.arquivos.arquivos)} arquivos · ${p.arquivos.arquivos_teste} arquivo(s) de teste</td></tr>
      ${p.url_prod?`<tr><td>Produção</td><td><a href="${esc(p.url_prod)}" target="_blank" rel="noreferrer">${esc(p.url_prod)}</a></td></tr>`:''}
      ${g.autores&&g.autores.length?`<tr><td>Autores</td><td>${g.autores.map(a=>`${esc(a.nome)} (${a.commits})`).join(' · ')}</td></tr>`:''}
    </table>
  </div>

  ${p.arquivos.linguagens.length?`<div class="secao"><h4>Composição do código</h4>
    <div class="langs">${langs}</div><div class="leg">${leg}</div></div>`:''}

  <div class="secao"><h4>Prontidão — ${pr.pct}% (${pr.pontos} de ${pr.total} pontos)</h4>
    <div class="barra" style="margin-bottom:11px"><i class="${pr.pct>=85?'b-ok':pr.pct>=60?'b-al':''}" style="width:${pr.pct}%"></i></div>
    <div class="chk">${pr.itens.map(i=>`<span class="${i.ok?'sim':''}">
      <b class="mk ${i.ok?'sim':'nao'}">${i.ok?'✓':'✕'}</b>${esc(i.rotulo)}
      <em style="color:var(--fraquinho);font-style:normal;font-size:11px">${i.peso}pt</em></span>`).join('')}</div>
  </div>

  <div class="secao"><h4>Projeção</h4>
    <table class="tabela">
      <tr><td>Velocidade</td><td>${pj.velocidade_4s ?? '—'} commits/semana nas últimas 4 · ${pj.velocidade_12s ?? '—'} nas 12 anteriores</td></tr>
      <tr><td>Tendência</td><td><b>${esc(pj.tendencia||'—')}</b></td></tr>
      <tr><td>Fechar o checklist</td><td>${esc(etaTxt)}</td></tr>
      <tr><td>Riscos</td><td>${(pj.riscos||[]).length?(pj.riscos.map(r=>`▲ ${esc(r)}`).join('<br>')):'nenhum detectado'}</td></tr>
    </table>
  </div>

  ${p.containers.length?`<div class="secao"><h4>Containers deste projeto</h4>
    <div class="infra">${p.containers.map(ct=>`<div class="cbox${ct.reiniciando?' ruim':''}">
      <div><div class="n">${esc(ct.nome)}</div><div class="s">${esc(ct.imagem)}</div></div>
      <div class="s" style="text-align:right">${esc(ct.status)}<br>${esc(ct.portas||'—')}</div></div>`).join('')}</div></div>`:''}

  ${(p.portas||[]).length?`<div class="secao"><h4>Portas esperadas</h4>
    <div class="pes">${p.portas.map(x=>`<span class="pastilha"><i class="pt ${x.vivo?'on':'off'}"></i>
      ${x.vivo?`<a href="http://localhost:${x.porta}" target="_blank" rel="noreferrer">localhost:${x.porta}</a>`:`localhost:${x.porta} — fora do ar`}</span>`).join('')}</div></div>`:''}
  `;
  document.getElementById('dlg').showModal();
}

/* ------------------------------------------------------------------- roadmap */
function roadmap(ps){
  const comEta = ps.filter(p => p.projecao.eta && p.projecao.eta.data)
                   .sort((a,b) => a.projecao.eta.data.localeCompare(b.projecao.eta.data));
  const semEta = ps.filter(p => !(p.projecao.eta && p.projecao.eta.data));
  if(!comEta.length) return '<div class="vazio">Nenhum projeto tem velocidade recente suficiente para projetar prazo.</div>';
  const maxSem = Math.max(...comEta.map(p => p.projecao.eta.semanas));
  return `<table><thead><tr>
      <th>Projeto</th><th>Falta</th><th>Horizonte</th><th>Data estimada</th><th>Confiança</th><th>Tendência</th>
    </tr></thead><tbody>` +
    comEta.map(p => {
      const e = p.projecao.eta;
      return `<tr>
        <td><b>${esc(p.titulo)}</b></td>
        <td style="font-family:var(--mono)">${p.prontidao.total - p.prontidao.pontos} pt</td>
        <td><div class="trilho"><i style="width:${Math.max(4, 100*e.semanas/maxSem).toFixed(0)}%"></i></div></td>
        <td style="font-family:var(--mono)">${esc(e.data)}</td>
        <td>${esc(e.confianca)}</td>
        <td>${esc(p.projecao.tendencia)}</td>
      </tr>`;
    }).join('') +
    (semEta.length ? `<tr><td colspan="6" style="color:var(--fraco);font-size:12.5px">
      Sem projeção (parados ou completos): ${semEta.map(p=>esc(p.titulo)).join(' · ')}</td></tr>` : '') +
    '</tbody></table>';
}

/* -------------------------------------------------------------------- render */
function desenhar(){
  const ps = DADOS.projetos, infra = DADOS.infra;
  document.getElementById('carimbo').textContent =
    'coletado ' + new Date(DADOS.gerado_em).toLocaleTimeString('pt-BR');
  document.getElementById('kpis').innerHTML = kpis(ps, infra);
  document.getElementById('alertas').innerHTML = alertas(ps, infra);

  const usadas = FASES.filter(f => ps.some(p => p.fase === f));
  document.getElementById('chips').innerHTML = usadas.map(f =>
    `<button class="chip" data-fase="${f}" aria-pressed="${FASE_ATIVA===f}">${f} ${ps.filter(p=>p.fase===f).length}</button>`).join('');

  const termo = document.getElementById('busca').value.trim().toLowerCase();
  const ordem = document.getElementById('ordem').value;
  let vis = ps.filter(p =>
    (!FASE_ATIVA || p.fase === FASE_ATIVA) &&
    (!termo || (p.nome + ' ' + p.titulo + ' ' + p.resumo).toLowerCase().includes(termo)));

  const chave = {
    atividade: p => (p.git.dias_parado ?? 99999),
    prontidao: p => -p.prontidao.pct,
    risco:     p => -((p.projecao.riscos||[]).length),
    tamanho:   p => -p.arquivos.linhas,
    nome:      p => p.nome.toLowerCase(),
  }[ordem];
  vis.sort((a,b) => { const x=chave(a), y=chave(b); return x<y?-1:x>y?1:0; });

  document.getElementById('grade').innerHTML =
    vis.length ? vis.map(card).join('') : '<div class="vazio">Nenhum projeto com esse filtro.</div>';
  document.getElementById('road').innerHTML = roadmap(ps);
  document.getElementById('metodo').innerHTML =
    `<b>Como a projeção é feita:</b> velocidade = commits das últimas 4 semanas ÷ 4, comparada com a média das 12 semanas anteriores.
     O horizonte assume ~4 commits de trabalho por ponto de prontidão que falta, dividido pela velocidade atual.
     É extrapolação de ritmo histórico, não estimativa de escopo — serve para ordenar prioridade, não para prometer data a cliente.
     A prontidão soma ${ps[0]?.prontidao.total ?? 0} pontos de critérios objetivos (README, CI, teste, Docker, deploy, git limpo, docs, .gitignore, exemplo de variáveis, sem segredo na raiz).`;

  document.getElementById('infra').innerHTML = infra.containers.map(c =>
    `<div class="cbox${c.reiniciando?' ruim':''}">
      <div style="min-width:0"><div class="n">${esc(c.nome)}</div><div class="s">${esc(c.imagem)}</div></div>
      <div class="s" style="text-align:right;white-space:nowrap">${esc(c.status)}</div>
    </div>`).join('') || '<div class="vazio">Nenhum container em execução.</div>';
  document.getElementById('portas').innerHTML =
    `<b>Portas em escuta nesta máquina:</b> ${infra.portas.map(p=>`<code>${p}</code>`).join(' ')}`;
}

/* -------------------------------------------------------------------- eventos */
document.getElementById('grade').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if(c) detalhe(DADOS.projetos.find(p => p.nome === c.dataset.nome));
});
document.getElementById('grade').addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.closest('.card'))
    detalhe(DADOS.projetos.find(p => p.nome === e.target.closest('.card').dataset.nome));
});
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  FASE_ATIVA = FASE_ATIVA === b.dataset.fase ? null : b.dataset.fase;
  desenhar();
});
document.getElementById('busca').addEventListener('input', desenhar);
document.getElementById('ordem').addEventListener('change', desenhar);
document.getElementById('btn-agora').addEventListener('click', () => carregar(true));
document.getElementById('btn-tema').addEventListener('click', () => {
  const atual = document.documentElement.getAttribute('data-theme');
  const novo = atual === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', novo);
  try{ localStorage.setItem('tema', novo); }catch(e){}
});
try{ const t = localStorage.getItem('tema'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}

carregar(false);
setInterval(() => carregar(false), 15000);   // a pagina relê; quem recoleta é o servidor
</script>
</body>
</html>
