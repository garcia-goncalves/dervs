# DERVS — o porteiro do site, no nginx do servidor.
#
# ESTE ARQUIVO NÃO É APLICADO POR NENHUM WORKFLOW, e isso é decisão, não
# esquecimento. A VPS não é terreno limpo: são 26 containers servindo 8 sistemas,
# e um script que escreve em /etc/nginx/sites-enabled/ é um script que pode
# derrubar o Ajudei às três da manhã. Quem instala este arquivo é uma pessoa,
# uma vez, seguindo docs/operacao/publicar-no-servidor.md. Depois disso as
# publicações trocam só o container, e o nginx nunca mais é tocado.
#
# Onde ele mora no servidor:
#   /etc/nginx/sites-available/dervs.conf
#   /etc/nginx/sites-enabled/dervs.conf   (link simbólico para o de cima)
#
# A porta 4877 aparece duas vezes aqui e uma vez no .env do servidor
# (DERVS_PORTA). As três têm de ser o mesmo número, e ele tem de estar livre —
# conferir antes está no roteiro.

# ---------------------------------------------------------------------------
# O freio das portas de entrada.
#
# `/entrada` (a combinação da capa) e `/agente/parear` (o código de seis
# dígitos) são rotas abertas: quem chega ali ainda não tem sessão nenhuma. O
# painel já tem um teto de cinco tentativas por quinze minutos, mas esse teto é
# a última linha — quando ele dispara, dispara para todo mundo. Este freio é a
# primeira: corta a enxurrada antes de ela virar tentativa contada.
#
# 6 por minuto, com fôlego de 4: quem erra a combinação e tenta de novo não
# sente nada; quem chama num laço leva 429 na sétima.
#
# A zona vive aqui fora dos `server{}` de propósito — `limit_req_zone` só vale
# no nível `http{}`, e este arquivo é incluído lá. O nome tem prefixo `dervs_`
# porque a máquina tem outros 8 sistemas e o espaço de nomes é compartilhado.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=dervs_portas:1m rate=6r/m;

# ---------------------------------------------------------------------------
# Porta 80: só existe para mandar todo mundo para o https, e para deixar o
# Let's Encrypt renovar o certificado.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dervs.com.br www.dervs.com.br;

    # A renovação do certificado tem de continuar funcionando em texto claro.
    # Sem esta exceção, o redirecionamento de baixo engoliria a verificação e o
    # certificado venceria sozinho em 90 dias, sem aviso.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://dervs.com.br$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www → sem www. Um endereço só, para que o cookie de sessão não fique preso
# num domínio e a pessoa "deslogue" ao trocar de um para o outro.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.dervs.com.br;

    ssl_certificate     /etc/letsencrypt/live/dervs.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dervs.com.br/privkey.pem;

    return 301 https://dervs.com.br$request_uri;
}

# ---------------------------------------------------------------------------
# O site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dervs.com.br;

    ssl_certificate     /etc/letsencrypt/live/dervs.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dervs.com.br/privkey.pem;

    # Explícito de propósito. Sem esta linha valeria o que o `http{}` da máquina
    # definir — e esse `http{}` é compartilhado com os outros 8 sistemas. Se
    # ninguém tiver definido, o padrão do nginx ainda aceita TLSv1.1, que não
    # deveria estar de pé em 2026.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # O painel serve um HTML de uma página, uma folha de estilo e duas fontes.
    # 2 MB é folga larga para o maior corpo que ele aceita (o relatório do
    # agente pareado) e teto apertado para quem quiser entupir a máquina.
    client_max_body_size 2m;

    # ------------------------------------------------------------- cabeçalhos
    # HSTS: depois da primeira visita, o navegador se recusa a falar http com
    # este domínio, mesmo que alguém o convença a tentar. Um ano, e vale para
    # os subdomínios.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # O navegador respeita o Content-Type que o servidor mandou e não tenta
    # adivinhar. Sem isto, um arquivo que o servidor chama de texto pode acabar
    # executado como script.
    add_header X-Content-Type-Options "nosniff" always;
    # Ninguém coloca o painel dentro de um quadro de outro site.
    add_header X-Frame-Options "DENY" always;
    # O endereço da página não vai junto quando alguém sai daqui por um link.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # O painel não usa câmera, microfone nem localização. Dizer isso fecha a
    # porta antes de alguém precisar dela.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # O painel serve HTML, CSS e fontes DO PRÓPRIO DOMÍNIO, e mais nada. Dizer
    # isso fecha a classe inteira de script injetado: mesmo que um texto
    # hostil chegasse à tela, o navegador se recusaria a executá-lo.
    # `frame-ancestors 'none'` faz o mesmo que o X-Frame-Options acima, para os
    # navegadores que já não olham aquele.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # ------------------------------------------------------- as portas de entrada
    # As duas rotas em que um estranho pode bater sem ter sessão nenhuma. O
    # freio está aqui, e o teto de tentativas do painel está lá dentro: são
    # duas defesas independentes, e a de fora existe para que a de dentro
    # raramente precise disparar.
    #
    # NENHUM `add_header` nestes blocos, e isso é regra do nginx, não descuido:
    # um `add_header` dentro de um `location` ANULA todos os do `server`. Um
    # cabeçalho de segurança acrescentado aqui apagaria os seis de cima.
    location = /entrada {
        limit_req zone=dervs_portas burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4877;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        # Os mesmos do `location /`. Foram esquecidos quando este bloco
        # foi copiado de la, e sem eles uma conexao com o container fora
        # do ar fica presa 60s em vez de 5s.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /agente/parear {
        limit_req zone=dervs_portas burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4877;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        # Os mesmos do `location /`. Foram esquecidos quando este bloco
        # foi copiado de la, e sem eles uma conexao com o container fora
        # do ar fica presa 60s em vez de 5s.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------- o repasse
    location / {
        # 127.0.0.1 e não o nome do container: o nginx roda no HOST, fora do
        # Docker, e não enxerga a rede interna dele. O que ele enxerga é a porta
        # que o compose prendeu ao loopback.
        proxy_pass http://127.0.0.1:4877;

        # `$host` — e NÃO `$proxy_host`, NEM `$http_host`. As duas trocas são
        # tentadoras e as duas quebram alguma coisa:
        #
        #   `$proxy_host` mandaria `127.0.0.1:4877`, que não está na lista
        #   fechada do servidor Python: o site inteiro responderia 403.
        #
        #   `$http_host` é o Host CRU do visitante, com a porta. Hoje o `$host`
        #   apaga a porta, e é isso que impede um `Host: 127.0.0.1:4777` vindo
        #   da internet de casar com a entrada de loopback que o servidor mantém
        #   para o healthcheck. Com `$http_host` esse pedido passaria — e o Host
        #   aceito alimenta o endereço de volta do login com GitHub e o
        #   identificador das chaves de acesso. Trocar aqui abre lá.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # O Python está atrás do certificado, não na frente dele. Sem esta
        # linha ele acharia que a conversa é em texto claro.
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;

        # O painel monta a resposta inteira antes de mandar; não há stream nem
        # websocket. Sem buffer, cada resposta viraria vários pacotes pequenos.
        proxy_buffering on;
    }

    # O log de acesso guarda endereço IP, que é dado pessoal. Trinta dias bastam
    # para investigar um problema, e o logrotate do sistema cuida do resto.
    access_log /var/log/nginx/dervs.access.log;
    error_log  /var/log/nginx/dervs.error.log;
}
