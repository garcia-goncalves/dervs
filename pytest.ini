; Este repositorio NAO roda por pytest.
;
; A CI chama `python test_X.py`, um passo por arquivo, listado a mao em
; `.github/workflows/ci.yml` — e ha um passo que cobra essa lista. Nada aqui
; muda isso, e nenhum teste depende deste arquivo para passar.
;
; Ele existe para UMA ferramenta de fora: o verificador automatico do harness,
; que chama pytest sobre "os testes vizinhos do que foi editado". Quando varias
; etapas de um plano rodam em paralelo, cada executor trabalha numa copia
; isolada em `.claude/worktrees/agent-<id>/`, e o disco passa a ter varios
; `test_servir.py`. No modo de importacao antigo (`prepend`), o pytest importa
; arquivo de teste como MODULO pelo nome-base: N copias viram N tentativas de
; importar o mesmo nome `test_servir`, e da segunda em diante ele para com
;
;     import file mismatch: imported module 'test_servir' has this __file__ ...
;
; Isso e erro de COLETA, nao teste vermelho. Aconteceu tres vezes em 02/09/2026,
; e nas tres a suite de verdade estava inteira verde. Alarme falso repetido
; treina quem le a ignorar alarme, que e o dano de verdade.
;
; `importlib` importa cada arquivo pelo caminho, sem registrar o nome-base num
; espaco global — e a colisao deixa de existir. Duas tentativas anteriores
; falharam por motivo registrado: `norecursedirs` nao vale para caminho passado
; explicitamente, e `pytest_ignore_collect` nao e consultado para arquivo
; passado um a um na linha de comando.

[pytest]
addopts = --import-mode=importlib
norecursedirs = .claude .git __pycache__ vivo
