<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>sh</title>
<style>
  :root {
    color-scheme: dark;
    --fundo: #05070a;
    --vidro: #0a0e13;
    --barra: #0e141b;
    --borda: #1a232e;
    --tinta: #cdd9e3;
    --fraca: #56646f;
    --neon: #4ade80;
    --alerta: #f87171;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", "JetBrains Mono",
            Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(120% 90% at 50% 0%, #0b1219 0%, var(--fundo) 62%),
      var(--fundo);
    color: var(--tinta);
    font: .9rem/1.65 var(--mono);
    display: grid;
    place-items: center;
    padding: 1.5rem 1rem;
  }
  /* Linhas horizontais tenues, no fundo. Decoracao, fora do fluxo. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom, rgba(120, 200, 160, .035) 0 1px, transparent 1px 3px);
  }

  main {
    position: relative;
    width: min(34rem, 100%);
    background: var(--vidro);
    border: 1px solid var(--borda);
    border-radius: .5rem;
    overflow: hidden;
    box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .6);
  }

  .barra {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .55rem .8rem;
    background: var(--barra);
    border-block-end: 1px solid var(--borda);
    color: var(--fraca);
    font-size: .72rem;
    letter-spacing: .04em;
  }
  .bolha { width: .6rem; height: .6rem; border-radius: 50%; background: #263241; }
  .barra .titulo { margin-inline-start: auto; margin-inline-end: auto; }

  .corpo { padding: clamp(1.1rem, 4vw, 1.8rem); }

  .linha { margin: 0; white-space: nowrap; overflow-x: auto; }
  .prompt { color: var(--neon); }
  .prompt::before { content: "$ "; }
  .fraca { color: var(--fraca); }
  .ok { color: var(--neon); }
  .falha { color: var(--alerta); }
  .saida { margin: .9rem 0 0; color: var(--fraca); }

  hr {
    border: 0;
    border-block-start: 1px dashed var(--borda);
    margin: 1.5rem 0 1.2rem;
  }

  .chave {
    display: flex;
    align-items: center;
    gap: .55rem;
    flex-wrap: wrap;
    margin-block-end: 1.3rem;
  }
  .chave .rotulo { color: var(--neon); }
  .slots { display: flex; gap: .4rem; }
  .slot {
    width: 1.5rem;
    height: 2.1rem;
    display: grid;
    place-items: center;
    border: 1px solid var(--borda);
    border-radius: .2rem;
    background: #070b0f;
    color: var(--neon);
    font-size: 1.05rem;
  }
  .slot::after { content: "\00b7"; color: #2b3742; }
  .slot[data-cheia] { border-color: #2f6b4b; }
  .slot[data-cheia]::after { content: "\2022"; color: var(--neon); }

  .cursor {
    width: .55rem;
    height: 1.1rem;
    background: var(--neon);
  }
  @media (prefers-reduced-motion: no-preference) {
    .cursor { animation: piscar 1.05s steps(1) infinite; }
    @keyframes piscar { 50% { opacity: 0; } }
    .slot { transition: border-color .12s ease; }
  }

  /* Invisivel, e nao `display:none`: assim continua recebendo foco, teclado
     fisico, colagem e preenchimento automatico. */
  .campo {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  .teclado {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .45rem;
  }
  .teclado button {
    font: inherit;
    font-size: .95rem;
    min-height: 2.9rem;
    color: var(--tinta);
    background: #0d141b;
    border: 1px solid var(--borda);
    border-radius: .3rem;
    cursor: pointer;
  }
  .teclado button::before { content: "["; color: var(--fraca); }
  .teclado button::after  { content: "]"; color: var(--fraca); }
  .teclado button:hover { background: #131c25; border-color: #2b3a49; }
  .teclado button:active { background: #18232d; }
  .teclado button[type="submit"] { color: var(--neon); }

  :is(button, a, input):focus-visible {
    outline: 2px solid var(--neon);
    outline-offset: 2px;
  }

  .entrar {
    display: block;
    margin-block-start: 1.4rem;
    padding: .9rem;
    text-align: center;
    border: 1px solid #2f6b4b;
    border-radius: .3rem;
    color: var(--neon);
    text-decoration: none;
    font-size: .8rem;
    letter-spacing: .08em;
  }
  .entrar:hover { background: #0c1a13; }
</style>
</head>
<body>
<main>
  <div class="barra" aria-hidden="true">
    <span class="bolha"></span><span class="bolha"></span><span class="bolha"></span>
    <span class="titulo">sh &#8212; 80&#215;24</span>
  </div>

  <div class="corpo">
    <p class="linha prompt">uptime</p>
    <p class="linha fraca">load average: 0.00, 0.00, 0.00</p>

    <p class="linha prompt">./checar.sh --all</p>
    <p class="linha"><span class="ok">[ok]</span>   <span class="fraca">rede</span></p>
    <p class="linha"><span class="ok">[ok]</span>   <span class="fraca">disco</span></p>
    <p class="linha"><span class="falha">[--]</span>   <span class="fraca">handshake</span></p>

    <p class="saida">exit status 137 &#183; nada escutando nesta porta</p>

    <hr>

    <form id="porta" method="post" action="/entrada" novalidate>
      <div class="chave">
        <span class="rotulo" aria-hidden="true">chave&#8239;&#8250;</span>
        <span class="slots" aria-hidden="true">
          <span class="slot"></span><span class="slot"></span><span class="slot"></span>
          <span class="slot"></span><span class="slot"></span><span class="slot"></span>
        </span>
        <span class="cursor" aria-hidden="true"></span>
      </div>

      <label class="campo" for="combinacao">Chave de seis d&#237;gitos</label>
      <input class="campo" id="combinacao" name="combinacao" type="text"
             inputmode="numeric" enterkeyhint="done" autocomplete="one-time-code"
             maxlength="6" pattern="\d{6}" autofocus>

      <div class="teclado">
        <button type="button" data-d="1">1</button>
        <button type="button" data-d="2">2</button>
        <button type="button" data-d="3">3</button>
        <button type="button" data-d="4">4</button>
        <button type="button" data-d="5">5</button>
        <button type="button" data-d="6">6</button>
        <button type="button" data-d="7">7</button>
        <button type="button" data-d="8">8</button>
        <button type="button" data-d="9">9</button>
        <button type="submit" aria-label="Confirmar">&#8629;</button>
        <button type="button" data-d="0">0</button>
        <button type="button" data-apagar aria-label="Apagar o &#250;ltimo d&#237;gito">&#8592;</button>
      </div>
    </form>

    __PORTA_ABERTA__
  </div>
</main>

<script>
(function () {
  "use strict";
  var porta = document.getElementById("porta");
  var campo = document.getElementById("combinacao");
  var slots = Array.prototype.slice.call(document.querySelectorAll(".slot"));
  var enviando = false;

  function pintar() {
    campo.value = campo.value.replace(/\D/g, "").slice(0, 6);
    slots.forEach(function (s, i) {
      if (i < campo.value.length) { s.setAttribute("data-cheia", ""); }
      else { s.removeAttribute("data-cheia"); }
    });
  }

  campo.addEventListener("input", pintar);

  porta.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { return; }
    if (b.hasAttribute("data-d")) { campo.value += b.getAttribute("data-d"); }
    else if (b.hasAttribute("data-apagar")) { campo.value = campo.value.slice(0, -1); }
    else { return; }
    pintar();
    campo.focus();
  });

  porta.addEventListener("submit", function (e) {
    e.preventDefault();
    if (enviando) { return; }
    enviando = true;
    fetch("/entrada", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ combinacao: campo.value })
    }).catch(function () {
    }).then(function () { location.reload(); });
  });

  pintar();
})();
</script>
</body>
</html>
