<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sala de Leitura</title>
<style>
  :root {
    color-scheme: dark;
    --tinta: #e8e4de;
    --tinta-fraca: #7d7873;
    --fundo: #0a0908;
    --caixa: #131211;
    --borda: #262320;
    --traco: #a3231f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--tinta);
    font: 1rem/1.6 Georgia, "Times New Roman", serif;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
  }
  main {
    width: min(30rem, 100%);
    text-align: center;
    border: 1px solid var(--borda);
    border-radius: 1rem;
    padding: clamp(1.5rem, 5vw, 3rem);
    background: var(--caixa);
  }
  h1 {
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    font-variant: small-caps;
    letter-spacing: .02em;
    font-weight: 400;
    margin: 0 0 1.5rem;
    position: relative;
    display: inline-block;
  }
  /* Decoracao pura: fora do fluxo do texto, invisivel para leitor de tela. */
  h1::after {
    content: "";
    position: absolute;
    inset-inline: -8%;
    inset-block-start: 52%;
    border-block-start: 2px solid var(--traco);
  }
  .selo {
    display: inline-block;
    border: 1px solid var(--traco);
    color: var(--traco);
    font-size: .78rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    padding: .6rem 1.2rem;
    margin-block-end: 2rem;
  }
  p { margin: .3rem 0; color: var(--tinta-fraca); }
  hr { border: 0; border-block-start: 1px solid var(--borda); margin: 2rem 0; }
  .aviso {
    font-size: .74rem;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .remate { font-style: italic; color: var(--tinta); margin-block: 1.2rem 2rem; }

  .marcas { display: flex; gap: .75rem; justify-content: center; margin-block-end: 1.75rem; }
  .marca {
    width: .55rem; height: .55rem; border-radius: 50%;
    border: 1px solid var(--tinta-fraca);
  }
  .marca[data-cheia] { background: var(--tinta); border-color: var(--tinta); }
  @media (prefers-reduced-motion: no-preference) {
    .marca { transition: background-color .12s ease, border-color .12s ease; }
  }

  /* Invisivel, e nao `display:none`: assim continua recebendo foco, teclado
     fisico, colagem e preenchimento automatico. */
  .campo {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; border: 0;
  }
  .teclado {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .6rem;
  }
  .teclado button {
    font: inherit;
    font-size: 1.1rem;
    min-height: 3.4rem;
    color: var(--tinta);
    background: #1b1917;
    border: 1px solid var(--borda);
    border-radius: .6rem;
    cursor: pointer;
  }
  .teclado button:hover { background: #232120; }
  .teclado button:active { background: #2c2927; }
  :is(button, a, input):focus-visible {
    outline: 2px solid var(--tinta);
    outline-offset: 3px;
  }
  .entrar {
    display: block;
    margin-block-start: 2rem;
    padding: 1rem;
    border: 1px solid var(--tinta-fraca);
    border-radius: .6rem;
    color: var(--tinta);
    text-decoration: none;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: .82rem;
  }
  .entrar:hover { border-color: var(--tinta); }
</style>
</head>
<body>
<main>
  <h1>Sala de Leitura</h1>
  <div class="selo">Fora de operação</div>

  <p>Esta sala foi fechada.</p>
  <p>Os volumes voltaram para as caixas, e as caixas para o porão.</p>

  <hr>

  <p class="aviso">A combinação antiga ainda abre a porta.</p>
  <p class="remate">Não há mais nada do outro lado.</p>

  <form id="porta" method="post" action="/entrada" novalidate>
    <div class="marcas" aria-hidden="true">
      <span class="marca"></span><span class="marca"></span><span class="marca"></span>
      <span class="marca"></span><span class="marca"></span><span class="marca"></span>
    </div>

    <label class="campo" for="combinacao">Combinação de seis dígitos</label>
    <input class="campo" id="combinacao" name="combinacao" type="text"
           inputmode="numeric" enterkeyhint="done" autocomplete="one-time-code"
           maxlength="6" pattern="\d{6}" autofocus>

    <div class="teclado">
      <button type="button" data-d="1">1</button>
      <button type="button" data-d="2">2</button>
      <button type="button" data-d="3">3</button>
      <button type="button" data-d="4">4</button>
      <button type="button" data-d="5">5</button>
      <button type="button" data-d="6">6</button>
      <button type="button" data-d="7">7</button>
      <button type="button" data-d="8">8</button>
      <button type="button" data-d="9">9</button>
      <button type="submit" aria-label="Confirmar">&#10003;</button>
      <button type="button" data-d="0">0</button>
      <button type="button" data-apagar aria-label="Apagar o último dígito">&#9003;</button>
    </div>
  </form>

  __PORTA_ABERTA__
</main>

<script>
(function () {
  "use strict";
  var porta = document.getElementById("porta");
  var campo = document.getElementById("combinacao");
  var marcas = Array.prototype.slice.call(document.querySelectorAll(".marca"));
  var enviando = false;

  function pintar() {
    campo.value = campo.value.replace(/\D/g, "").slice(0, 6);
    marcas.forEach(function (m, i) {
      if (i < campo.value.length) { m.setAttribute("data-cheia", ""); }
      else { m.removeAttribute("data-cheia"); }
    });
  }

  campo.addEventListener("input", pintar);

  porta.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { return; }
    if (b.hasAttribute("data-d")) { campo.value += b.getAttribute("data-d"); }
    else if (b.hasAttribute("data-apagar")) { campo.value = campo.value.slice(0, -1); }
    else { return; }
    pintar();
    campo.focus();
  });

  porta.addEventListener("submit", function (e) {
    e.preventDefault();
    if (enviando) { return; }
    enviando = true;
    fetch("/entrada", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ combinacao: campo.value })
    }).catch(function () {
    }).then(function () { location.reload(); });
  });

  pintar();
})();
</script>
</body>
</html>
